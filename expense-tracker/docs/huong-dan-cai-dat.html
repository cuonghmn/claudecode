 .mstrip.more { -webkit-mask-image: linear-gradient(to right, transparent 0, #000 18px); mask-image: linear-gradient(to right, transparent 0, #000 18px); }\n  .mstrip::-webkit-scrollbar { display: none; }\n  .mchip { flex: none; min-width: 66px; min-height: 60px; display: flex; flex-direction: column; align-items: stretch; justify-content: center;\n    gap: 2px; background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 12px; padding: 6px 8px;\n    font-weight: 600; font-size: 13px; text-align: center; scroll-snap-align: center; }\n  .mchip small { font-size: 12px; font-weight: 500; color: var(--muted); }\n  .mbar { display: block; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }\n  .mbar i { display: block; height: 100%; background: var(--muted); }\n  .mchip.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }\n  .mchip.on small { color: var(--on-brand); opacity: .85; }\n  .mchip.on .mbar { background: color-mix(in srgb, var(--on-brand) 30%, transparent); }\n  .mchip.on .mbar i { background: var(--on-brand); }\n  /* Tháng đang diễn ra: thanh nét đứt vì số liệu chưa đủ tháng */\n  .mchip.now .mbar i { background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 7px); }\n  .mchip.now.on .mbar i { background: repeating-linear-gradient(90deg, var(--on-brand) 0 4px, transparent 4px 7px); }\n  .mcal { flex: none; min-width: 48px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); color: var(--muted); padding: 0; }\n  .chart { width: 100%; height: 120px; display: block; }\n  .review h3 { font-size: 14px; margin: 12px 0 4px; } .review h3:first-child { margin-top: 0; }\n  .review ul { margin: 4px 0; padding-left: 18px; } .review p { margin: 4px 0; }\n\n  .cat-name { display: flex; flex-direction: column; min-width: 0; }\n  .cat-name small { color: var(--muted); font-size: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; margin-top: 1px; }\n  .pill { display: inline-block; font-size: 11px; font-weight: 600; line-height: 1; padding: 3px 7px; border-radius: 999px; white-space: nowrap; }\n  .pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }\n  .pill.off { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }\n  .bar > i.off { background: var(--muted); opacity: .45; }\n  .pill.save { color: var(--brand); background: var(--brand-soft); }\n  /* Biểu đồ tròn cơ cấu chi tiêu */\n  .donut-wrap { display: grid; gap: 14px; justify-items: center; }\n  @media (min-width: 560px) { .donut-wrap { grid-template-columns: 180px 1fr; justify-items: stretch; align-items: center; } }\n  .donut { width: 180px; height: 180px; display: block; }\n  .donut circle.seg { cursor: pointer; transition: opacity .2s; }\n  .donut.focus circle.seg:not(.on) { opacity: .25; }\n  .donut text { fill: var(--text); font-family: var(--font); text-anchor: middle; }\n  .donut .cv { font-size: 17px; font-weight: 700; }\n  .donut .cl { font-size: 11px; fill: var(--muted); }\n  .legend { display: grid; gap: 2px; width: 100%; min-width: 0; }\n  .legend button { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 8px; align-items: center; background: transparent; color: var(--text);\n    font-weight: 500; text-align: left; padding: 6px 8px; min-height: 40px; border-radius: 8px; }\n  .legend button.on { background: var(--bg); }\n  .legend .sw { width: 12px; height: 12px; border-radius: 3px; }\n  .legend .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n  .legend .pc { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }\n  .legend .am { font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; min-width: 64px; }\n  .pill.ovr { color: var(--text); background: var(--bg); border: 1px dashed var(--muted); }\n  .cat-name .def { font-size: 12px; color: var(--muted); }\n  .cat-row input.ovr { border-color: var(--brand); border-style: dashed; }\n  .reset { min-width: 44px; padding: 0; font-size: 18px; }\n  .apply { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--brand-soft); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }\n  .apply span { flex: 1; min-width: 180px; font-size: 13px; }\n  .amt.save { color: var(--brand); }\n  .icon-pick { display: flex; gap: 4px; flex-wrap: wrap; }\n  .icon-pick button { min-height: 40px; min-width: 40px; padding: 4px 6px; font-size: 18px; background: transparent; }\n  .icon-pick button:hover { background: var(--bg); }\n  .notice { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-top: 10px; font-size: 14px; }\n  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }\n  .modal .sheet { background: var(--card); width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 92vh; overflow: auto; }\n  @media (min-width: 620px) { .modal { align-items: center; } .modal .sheet { border-radius: 18px; } }\n  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--text); color: var(--bg);\n    padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px);\n    display: flex; align-items: center; gap: 12px; }\n  .toast button { min-height: 36px; padding: 6px 10px; background: transparent; color: var(--brand-soft); font-weight: 700; text-decoration: underline; }\n  .cat-row.click { cursor: pointer; }\n  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent;\n    border-radius: 50%; animation: s .7s linear infinite; vertical-align: -2px; }\n  @keyframes s { to { transform: rotate(360deg); } }\n  .empty { text-align: center; color: var(--muted); padding: 24px 8px; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n  \u003c!-- ============ TAB: GHI NHANH ============ -->\n  \u003csection id=\"tab-add\">\n    \u003cdiv class=\"title-row\">\u003ch1>Ghi chi tiêu\u003c/h1>\u003cspan class=\"engine\" id=\"engine\">\u003c/span>\u003c/div>\n    \u003cdiv class=\"card\">\n      \u003ctextarea id=\"quick\" aria-label=\"Ghi chi tiêu bằng câu tự nhiên\" placeholder=\"Gõ tự nhiên rồi nhấn Enter, ví dụ:&#10;trưa phở 55k, grab 32k&#10;hôm qua siêu thị 650k thẻ\">\u003c/textarea>\n      \u003cdiv class=\"chips-label\" id=\"quickLabel\">\u003c/div>\n      \u003cdiv class=\"chips\" id=\"examples\">\u003c/div>\n      \u003cdiv class=\"row\" style=\"margin-top:10px\">\n        \u003cspan class=\"grow\">\u003c/span>\n        \u003cbutton class=\"ghost\" onclick=\"openManual()\">+ Nhập tay\u003c/button>\n        \u003cbutton class=\"primary\" id=\"btnParse\" onclick=\"doParse()\">Phân tích\u003c/button>\n      \u003c/div>\n      \u003cdiv id=\"previewWrap\" class=\"hidden\">\n        \u003cdiv id=\"previewList\">\u003c/div>\n        \u003cdiv class=\"row\" style=\"margin-top:10px\">\n          \u003cspan class=\"muted grow\" id=\"previewTotal\">\u003c/span>\n          \u003cbutton class=\"ghost\" onclick=\"clearPreview()\">Hủy\u003c/button>\n          \u003cbutton class=\"primary\" id=\"btnSave\" onclick=\"savePreview()\">Lưu\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card\">\n      \u003ch2 style=\"margin:0\">Gần đây\u003c/h2>\n      \u003cdiv class=\"range\" id=\"recentRange\">\n        \u003cbutton data-r=\"3d\" class=\"on\" onclick=\"setRange('3d')\">3 ngày\u003c/button>\n        \u003cbutton data-r=\"5d\" onclick=\"setRange('5d')\">5 ngày\u003c/button>\n        \u003cbutton data-r=\"week\" onclick=\"setRange('week')\">Tuần này\u003c/button>\n        \u003cbutton data-r=\"month\" onclick=\"setRange('month')\">Tháng này\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"muted\" id=\"recentSummary\">\u003c/div>\n      \u003cdiv id=\"recent\">\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ============ TAB: TỔNG QUAN ============ -->\n  \u003csection id=\"tab-dash\" class=\"hidden\">\n    \u003cdiv class=\"title-row\">\u003ch1>Tổng quan\u003c/h1>\u003cspan class=\"muted\" id=\"dashMonth\">\u003c/span>\u003c/div>\n    \u003cdiv class=\"mstrip-wrap\">\n      \u003cdiv class=\"mstrip\" id=\"dashStrip\" role=\"tablist\" aria-label=\"Chọn tháng\" onscroll=\"stripFade(this)\">\u003c/div>\n      \u003cbutton class=\"mcal\" aria-label=\"Chọn tháng khác\" onclick=\"pickMonth(S.dashMonth, pickDashMonth)\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/>\u003cpath d=\"M3 10h18\"/>\u003cpath d=\"M8 3v4\"/>\u003cpath d=\"M16 3v4\"/>\u003c/svg>\u003c/button>\n    \u003c/div>\n    \u003cdiv id=\"dash\">\u003c/div>\n  \u003c/section>\n\n  \u003c!-- ============ TAB: LỊCH SỬ ============ -->\n  \u003csection id=\"tab-hist\" class=\"hidden\">\n    \u003ch1>Lịch sử\u003c/h1>\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"range two\" id=\"hMode\">\n        \u003cbutton data-m=\"month\" class=\"on\" onclick=\"setHistMode('month')\">Theo tháng\u003c/button>\n        \u003cbutton data-m=\"range\" onclick=\"setHistMode('range')\">Từ ngày → đến ngày\u003c/button>\n      \u003c/div>\n      \u003cinput type=\"hidden\" id=\"hMonth\">\n      \u003cdiv class=\"mstrip-wrap\" id=\"hMonthBox\" style=\"margin:0\">\n        \u003cdiv class=\"mstrip\" id=\"histStrip\" role=\"tablist\" aria-label=\"Chọn tháng\" onscroll=\"stripFade(this)\">\u003c/div>\n        \u003cbutton class=\"mcal\" aria-label=\"Chọn tháng khác\" onclick=\"pickMonth($('hMonth').value, pickHistMonth)\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/>\u003cpath d=\"M3 10h18\"/>\u003cpath d=\"M8 3v4\"/>\u003cpath d=\"M16 3v4\"/>\u003c/svg>\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"grid2 hidden\" id=\"hRangeBox\">\n        \u003cdiv>\u003clabel for=\"hFrom\">Từ ngày\u003c/label>\u003cinput type=\"date\" id=\"hFrom\" onchange=\"loadHistory()\">\u003c/div>\n        \u003cdiv>\u003clabel for=\"hTo\">Đến ngày\u003c/label>\u003cinput type=\"date\" id=\"hTo\" onchange=\"loadHistory()\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"grid2\" style=\"margin-top:8px\">\n        \u003cselect id=\"hCat\" onchange=\"loadHistory()\">\u003c/select>\n        \u003cinput id=\"hQ\" placeholder=\"Tìm mô tả…\" oninput=\"debounceHistory()\">\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card\">\u003cdiv class=\"row\">\u003cspan class=\"grow muted\" id=\"hSummary\">\u003c/span>\u003c/div>\u003cdiv id=\"hist\">\u003c/div>\u003c/div>\n  \u003c/section>\n\n  \u003c!-- ============ TAB: NGÂN SÁCH ============ -->\n  \u003csection id=\"tab-budget\" class=\"hidden\">\n    \u003cdiv class=\"title-row\">\u003ch1>Ngân sách\u003c/h1>\u003cspan class=\"muted\" id=\"budMonthLabel\">\u003c/span>\u003c/div>\n    \u003cdiv class=\"mstrip-wrap\">\n      \u003cdiv class=\"mstrip\" id=\"budStrip\" role=\"tablist\" aria-label=\"Chọn tháng\" onscroll=\"stripFade(this)\">\u003c/div>\n      \u003cbutton class=\"mcal\" aria-label=\"Chọn tháng khác\" onclick=\"pickMonth(S.budMonth, pickBudMonth, 12)\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/>\u003cpath d=\"M3 10h18\"/>\u003cpath d=\"M8 3v4\"/>\u003cpath d=\"M16 3v4\"/>\u003c/svg>\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"row\">\n        \u003ch2 class=\"grow\" style=\"margin:0\" id=\"budCardTitle\">Hạn mức tháng\u003c/h2>\n        \u003cbutton onclick=\"openCategory()\">+ Danh mục\u003c/button>\n      \u003c/div>\n      \u003cp class=\"muted\" style=\"margin:6px 0 0\">Số nhập ở đây chỉ áp dụng cho tháng này. Bấm tên danh mục để sửa mặc định.\u003c/p>\n      \u003cdiv class=\"muted\" id=\"budgetStatus\" style=\"margin-top:8px\">\u003c/div>\n      \u003cdiv id=\"budgetList\">\u003c/div>\n      \u003cdiv class=\"row\" style=\"margin-top:12px\">\n        \u003cspan class=\"grow muted\">Tổng ngân sách chi: \u003cb id=\"budgetTotal\" class=\"num\">\u003c/b>\u003c/span>\n        \u003cspan class=\"muted\">Tự lưu khi nhập xong\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"apply hidden\" id=\"applyBox\">\n        \u003cspan id=\"applyText\">\u003c/span>\n        \u003cbutton class=\"primary\" id=\"btnApply\" onclick=\"applyAsDefault()\">Dùng làm mặc định\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card\">\u003ca id=\"sheetLink\" target=\"_blank\" style=\"color:var(--brand)\">Mở Google Sheet dữ liệu ↗\u003c/a>\u003c/div>\n  \u003c/section>\n\u003c/main>\n\n\u003cnav>\n  \u003cbutton data-tab=\"add\" class=\"active\" onclick=\"go('add')\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4 20h4L19 9l-4-4L4 16z\"/>\u003cpath d=\"M13.5 6.5l4 4\"/>\u003c/svg>Ghi\u003c/button>\n  \u003cbutton data-tab=\"dash\" onclick=\"go('dash')\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M3 21h18\"/>\u003cpath d=\"M6 17v-6\"/>\u003cpath d=\"M11 17V5\"/>\u003cpath d=\"M16 17v-9\"/>\u003cpath d=\"M21 17v-3\"/>\u003c/svg>Tổng quan\u003c/button>\n  \u003cbutton data-tab=\"hist\" onclick=\"go('hist')\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 7v5l3 2\"/>\u003c/svg>Lịch sử\u003c/button>\n  \u003cbutton data-tab=\"budget\" onclick=\"go('budget')\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"6\" width=\"18\" height=\"14\" rx=\"2\"/>\u003cpath d=\"M3 10h18\"/>\u003cpath d=\"M16 15h2\"/>\u003cpath d=\"M7 6V4h10v2\"/>\u003c/svg>Ngân sách\u003c/button>\n\u003c/nav>\n\n\u003cdiv id=\"modal\" class=\"modal hidden\" onclick=\"if(event.target===this)closeModal()\">\u003cdiv class=\"sheet\" id=\"modalBody\">\u003c/div>\u003c/div>\n\u003cdiv id=\"qaModal\" class=\"modal hidden\" style=\"z-index:15\" onclick=\"if(event.target===this)cancelQuickCat()\">\n  \u003cdiv class=\"sheet\">\n    \u003ch2>Thêm danh mục mới\u003c/h2>\n    \u003clabel for=\"qaName\">Tên danh mục\u003c/label>\n    \u003cinput id=\"qaName\" maxlength=\"40\" placeholder=\"Ví dụ: Thú cưng\" onkeydown=\"if(event.key==='Enter')saveQuickCat()\">\n    \u003clabel>Icon\u003c/label>\n    \u003cdiv class=\"row\" style=\"align-items:flex-start\">\n      \u003cinput id=\"qaIcon\" value=\"📌\" style=\"max-width:64px;text-align:center;font-size:20px\" maxlength=\"8\" aria-label=\"Icon\">\n      \u003cdiv class=\"icon-pick grow\" id=\"qaIcons\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"muted\" style=\"margin-top:8px\">Danh mục mới chưa có ngân sách. Bạn có thể đặt ngân sách sau ở tab Ngân sách.\u003c/div>\n    \u003cdiv class=\"row\" style=\"margin-top:14px\">\u003cspan class=\"grow\">\u003c/span>\n      \u003cbutton class=\"ghost\" onclick=\"cancelQuickCat()\">Hủy\u003c/button>\n      \u003cbutton class=\"primary\" id=\"btnQa\" onclick=\"saveQuickCat()\">Thêm &amp; chọn\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n/* ---------------- Trạng thái & tiện ích ---------------- */\nconst S = { init: null, preview: [], dashMonth: null, cats: {} };\n\nfunction api(fn) {\n  const args = Array.prototype.slice.call(arguments, 1);\n  return new Promise((resolve, reject) => {\n    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn].apply(null, args);\n  });\n}\nconst $ = id => document.getElementById(id);\nconst esc = s => String(s == null ? '' : s).replace(/[&\u003c>\"']/g, c => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nconst vnd = n => Math.round(n || 0).toLocaleString('vi-VN') + 'đ';\nconst short = n => n >= 1e6 ? (n / 1e6).toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + 'tr' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);\nconst digits = s => Number(String(s).replace(/\\D/g, '')) || 0;\nconst icon = name => esc((S.cats[name] && S.cats[name].icon) || '•');\nconst isSave = name => !!(S.cats[name] && S.cats[name].kind === 'save');\n/** Tổng tách 2 phần: chi tiêu và để dành. */\nconst splitSum = list => list.reduce((a, t) => { a[isSave(t.category) ? 'save' : 'spend'] += t.amount; return a; }, { spend: 0, save: 0 });\nconst ymLabel = ym => 'Tháng ' + Number(ym.slice(5)) + '/' + ym.slice(0, 4);\nconst dLabel = ymd => {\n  const t = S.init.today;\n  if (ymd === t) return 'Hôm nay';\n  const d = new Date(ymd + 'T00:00:00'), td = new Date(t + 'T00:00:00');\n  if ((td - d) / 864e5 === 1) return 'Hôm qua';\n  return ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][d.getDay()] + ', ' + ymd.slice(8) + '/' + ymd.slice(5, 7);\n};\n/** action (tùy chọn): { label, fn } — ví dụ nút \"Hoàn tác\". */\nfunction toast(msg, ms, action) {\n  document.querySelectorAll('.toast').forEach(t => t.remove());\n  const el = document.createElement('div'); el.className = 'toast';\n  const span = document.createElement('span'); span.textContent = msg; el.appendChild(span);\n  if (action) {\n    const b = document.createElement('button'); b.textContent = action.label;\n    b.onclick = () => { el.remove(); action.fn(); };\n    el.appendChild(b);\n  }\n  document.body.appendChild(el); setTimeout(() => el.remove(), ms || (action ? 5000 : 2600));\n}\nfunction busy(btn, on, label) {\n  if (on) { btn.dataset.l = btn.innerHTML; btn.innerHTML = '\u003cspan class=\"spin\">\u003c/span> ' + (label || ''); btn.disabled = true; }\n  else { btn.innerHTML = btn.dataset.l; btn.disabled = false; }\n}\nfunction fail(e) { toast('Lỗi: ' + (e && e.message || e), 4500); }\n/** withNew: thêm lựa chọn \"＋ Thêm danh mục mới…\" cuối danh sách (dùng ở màn ghi). */\nfunction catSelect(sel, attrs) {\n  return '\u003cselect class=\"cat-sel\" ' + (attrs || '') + ' data-prev=\"' + esc(sel) + '\" onchange=\"catChanged(this)\">' +\n    catOptions(sel) + '\u003coption value=\"__new__\">＋ Thêm danh mục mới…\u003c/option>\u003c/select>';\n}\nfunction catOptions(sel) {\n  return S.init.categories.map(c => '\u003coption' + (c.name === sel ? ' selected' : '') + ' value=\"' + esc(c.name) + '\">' + esc(c.icon) + ' ' + esc(c.name) + '\u003c/option>').join('');\n}\nfunction methodOptions(sel) {\n  return S.init.methods.map(m => '\u003coption' + (m === sel ? ' selected' : '') + '>' + esc(m) + '\u003c/option>').join('');\n}\nfunction fmtInput(el) { const n = digits(el.value); el.value = n ? n.toLocaleString('vi-VN') : ''; }\n\n/* ---------------- Bộ nhớ tạm: mở tab ngay, cập nhật ở nền ---------------- */\nconst CACHE = {};\n/**\n * Gọi server qua bộ nhớ tạm. Có sẵn dữ liệu thì render ngay (không chờ), sau đó tải bản mới\n * và chỉ render lại nếu dữ liệu thay đổi. Trả về false nếu kết quả đã cũ (người dùng đổi bộ lọc).\n */\nasync function cachedCall(key, fn, args, render, isCurrent) {\n  const hit = CACHE[key];\n  if (hit) render(hit.data);\n  const data = await api.apply(null, [fn].concat(args));\n  const str = JSON.stringify(data);\n  if (isCurrent && !isCurrent()) return;\n  if (hit && hit.str === str) return;\n  CACHE[key] = { data: data, str: str };\n  render(data);\n}\n/** Sau khi ghi/sửa/xóa: bỏ bộ nhớ tạm để mọi màn hình tải lại số liệu mới. */\nfunction invalidate() { Object.keys(CACHE).forEach(k => delete CACHE[k]); prefetch(); }\n/** Tải trước các màn hay mở để chuyển tab không phải chờ. */\nfunction prefetch() {\n  clearTimeout(prefetch.t);\n  prefetch.t = setTimeout(() => {\n    const ym = S.init.today.slice(0, 7);\n    if (!CACHE['dash|' + ym]) api('getDashboard', ym).then(d => { CACHE['dash|' + ym] = { data: d, str: JSON.stringify(d) }; }).catch(() => {});\n    if (!CACHE.months) api('getMonthTotals').then(d => { CACHE.months = { data: d, str: JSON.stringify(d) }; }).catch(() => {});\n    if (!CACHE['cats|' + ym]) api('getCategoryList', ym).then(d => { CACHE['cats|' + ym] = { data: d, str: JSON.stringify(d) }; }).catch(() => {});\n  }, 1500); // chờ màn hiện tại tải xong rồi mới tải trước ở nền\n}\n\n/* ---------------- Điều hướng ---------------- */\nfunction go(tab) {\n  ['add', 'dash', 'hist', 'budget'].forEach(t => $('tab-' + t).classList.toggle('hidden', t !== tab));\n  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));\n  window.scrollTo(0, 0);\n  if (tab === 'add') loadRecent();\n  if (tab === 'dash') loadDash();\n  if (tab === 'hist') loadHistory();\n  if (tab === 'budget') renderBudgets();\n}\n\n/* ---------------- Ghi nhanh ---------------- */\nconst EXAMPLES = ['trưa phở 55k, cafe 45k', 'grab 32k', 'hôm qua siêu thị 650k thẻ'];\n/**\n * Chưa có lịch sử: hiện câu ví dụ (bấm để điền vào ô).\n * Đã có khoản hay ghi: hiện \"Ghi lại nhanh\" — bấm là thêm thẳng vào danh sách chờ lưu với ngày hôm nay.\n */\nfunction renderQuick(quick) {\n  if (quick && quick.length) {\n    S.quick = quick;\n    $('quickLabel').textContent = 'Ghi lại nhanh';\n    $('examples').innerHTML = quick.map((q, i) =>\n      `\u003cbutton type=\"button\" class=\"chip\" onclick=\"addQuick(${i})\">${icon(q.category)} ${esc(q.description)} \u003cb class=\"num\">${short(q.amount)}\u003c/b>\u003c/button>`).join('');\n  } else {\n    $('quickLabel').textContent = 'Ví dụ';\n    $('examples').innerHTML = EXAMPLES.map((e, i) => `\u003cbutton type=\"button\" class=\"chip\" onclick=\"addExample(${i})\">${esc(e)}\u003c/button>`).join('');\n  }\n}\nfunction addExample(i) {\n  const q = $('quick'); q.value = (q.value.trim() ? q.value.trim() + ', ' : '') + EXAMPLES[i]; q.focus();\n}\nfunction addQuick(i) {\n  const q = S.quick[i];\n  S.preview.push({ date: S.init.today, amount: q.amount, category: q.category, description: q.description, method: q.method });\n  renderPreview();\n  $('btnSave').focus();\n}\n\nasync function doParse() {\n  const text = $('quick').value.trim();\n  if (!text) { $('quick').focus(); return; }\n  const btn = $('btnParse'); busy(btn, true, 'Đang đọc');\n  try {\n    const r = await api('parseInput', text);\n    if (r.warning) toast(r.warning, 4500);\n    if (!r.items.length) { toast('Không tìm thấy số tiền nào. Thử \"phở 55k\".'); return; }\n    S.preview = r.items; renderPreview();\n    $('btnSave').focus(); // Enter lần nữa là lưu\n  } catch (e) { fail(e); } finally { busy(btn, false); }\n}\n\nfunction renderPreview() {\n  $('previewWrap').classList.toggle('hidden', !S.preview.length);\n  $('previewList').innerHTML = S.preview.map((it, i) => `\n    \u003cdiv class=\"preview\">\n      \u003cdiv class=\"row\">\n        \u003cinput class=\"grow\" value=\"${esc(it.description)}\" oninput=\"S.preview[${i}].description=this.value\" placeholder=\"Mô tả\">\n        \u003cbutton class=\"ghost\" title=\"Bỏ\" onclick=\"S.preview.splice(${i},1);renderPreview()\">✕\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"grid2\" style=\"margin-top:8px\">\n        \u003cinput class=\"num\" inputmode=\"numeric\" value=\"${it.amount.toLocaleString('vi-VN')}\" onblur=\"fmtInput(this)\" oninput=\"S.preview[${i}].amount=digits(this.value);updPreviewTotal()\">\n        \u003cinput type=\"date\" value=\"${it.date}\" onchange=\"S.preview[${i}].date=this.value\">\n        ${catSelect(it.category, 'data-pi=\"' + i + '\" aria-label=\"Danh mục\"')}\n        \u003cselect onchange=\"S.preview[${i}].method=this.value\">${methodOptions(it.method)}\u003c/select>\n      \u003c/div>\n    \u003c/div>`).join('');\n  updPreviewTotal();\n}\nfunction updPreviewTotal() {\n  const t = S.preview.reduce((s, x) => s + (x.amount || 0), 0);\n  $('previewTotal').innerHTML = S.preview.length + ' khoản · \u003cb class=\"num\">' + vnd(t) + '\u003c/b>';\n  $('btnSave').textContent = 'Lưu ' + S.preview.length + ' khoản';\n}\nfunction clearPreview() { S.preview = []; renderPreview(); }\n\nasync function savePreview() {\n  if (S.preview.some(x => !x.amount)) { toast('Có khoản chưa có số tiền.'); return; }\n  const btn = $('btnSave'); busy(btn, true, 'Đang lưu');\n  try {\n    const ids = await api('addTransactions', S.preview);\n    $('quick').value = ''; clearPreview(); invalidate(); loadRecent();\n    toast('Đã lưu ' + ids.length + ' khoản ✓', 0, { label: 'Hoàn tác', fn: () => undoAdd(ids) });\n  } catch (e) { fail(e); } finally { busy(btn, false); updPreviewTotal(); }\n}\n\nconst RANGE_LABEL = { '3d': '3 ngày qua', '5d': '5 ngày qua', week: 'Tuần này', month: 'Tháng này' };\nlet recentRange = '3d';\nfunction setRange(r) {\n  recentRange = r;\n  $('recentRange').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.r === r));\n  loadRecent();\n}\n\nasync function loadRecent() {\n  const range = recentRange;\n  if (!CACHE['recent|' + range]) $('recent').innerHTML = '\u003cdiv class=\"empty\">\u003cspan class=\"spin\">\u003c/span>\u003c/div>';\n  try {\n    await cachedCall('recent|' + range, 'getRecent', [range], renderRecent, () => range === recentRange);\n  } catch (e) { fail(e); }\n}\nfunction renderRecent(r) {\n    if (r.range !== recentRange) return; // bỏ kết quả cũ nếu người dùng đã chọn khoảng khác\n    renderQuick(r.quick);\n    const from = r.start.slice(8) + '/' + r.start.slice(5, 7);\n    $('recentSummary').innerHTML = RANGE_LABEL[r.range] + ' (từ ' + from + '): ' + sumText(r.items);\n    $('recent').innerHTML = r.items.length ? groupByDay(r.items)\n      : '\u003cdiv class=\"empty\">Không có khoản nào trong ' + RANGE_LABEL[r.range].toLowerCase() + '. Ghi khoản đầu tiên ở trên nhé.\u003c/div>';\n    bindTx($('recent'), r.items);\n}\n\n/** Danh sách đã sắp xếp mới → cũ, gom theo ngày, mỗi ngày có tổng tiền. */\nfunction groupByDay(list) {\n  const groups = {}; list.forEach(t => (groups[t.date] = groups[t.date] || []).push(t));\n  return Object.keys(groups).map(d => {\n    const sum = splitSum(groups[d]);\n    return `\u003cdiv class=\"day-h\">\u003cspan>${dLabel(d)} · ${groups[d].length} khoản\u003c/span>\u003cspan class=\"num\">${vnd(sum.spend)}${sum.save ? ' · để dành ' + short(sum.save) : ''}\u003c/span>\u003c/div>` +\n    groups[d].map(t => txRow(t, true)).join('');\n  }).join('');\n}\n/** \"7 khoản · chi 1.268.000đ · để dành 3.000.000đ\" */\nfunction sumText(list) {\n  const sum = splitSum(list);\n  return list.length + ' khoản · chi \u003cb class=\"num\">' + vnd(sum.spend) + '\u003c/b>' + (sum.save ? ' · để dành \u003cb class=\"num\">' + vnd(sum.save) + '\u003c/b>' : '');\n}\n\nfunction txRow(t, hideDate) {\n  return `\u003cdiv class=\"tx\" data-id=\"${esc(t.id)}\">\n    \u003cdiv class=\"ic\">${icon(t.category)}\u003c/div>\n    \u003cdiv class=\"grow\">\u003cdiv>${esc(t.description || t.category)}\u003c/div>\n      \u003cdiv class=\"muted\">${isSave(t.category) ? '\u003cspan class=\"pill save\">Để dành\u003c/span> ' : ''}${esc(t.category)}${hideDate ? '' : ' · ' + dLabel(t.date)} · ${esc(t.method)}\u003c/div>\u003c/div>\n    \u003cdiv class=\"amt num${isSave(t.category) ? ' save' : ''}\">${vnd(t.amount)}\u003c/div>\u003c/div>`;\n}\nfunction bindTx(container, list) {\n  container.querySelectorAll('.tx').forEach(el => el.onclick = () => openEdit(list.find(t => t.id === el.dataset.id)));\n}\n\n/* ---------------- Modal: nhập tay / sửa ---------------- */\nfunction txForm(t) {\n  return `\n    \u003clabel>Mô tả\u003c/label>\u003cinput id=\"fDesc\" value=\"${esc(t.description || '')}\" placeholder=\"Ví dụ: Cơm trưa\">\n    \u003cdiv class=\"grid2\" style=\"margin-top:8px\">\n      \u003cdiv>\u003clabel>Số tiền (đ)\u003c/label>\u003cinput id=\"fAmt\" class=\"num\" inputmode=\"numeric\" value=\"${t.amount ? t.amount.toLocaleString('vi-VN') : ''}\" onblur=\"fmtInput(this)\">\u003c/div>\n      \u003cdiv>\u003clabel>Ngày\u003c/label>\u003cinput id=\"fDate\" type=\"date\" value=\"${t.date || S.init.today}\">\u003c/div>\n      \u003cdiv>\u003clabel for=\"fCat\">Danh mục\u003c/label>${catSelect(t.category || 'Ăn uống', 'id=\"fCat\"')}\u003c/div>\n      \u003cdiv>\u003clabel>Phương thức\u003c/label>\u003cselect id=\"fMethod\">${methodOptions(t.method || S.init.defaultMethod)}\u003c/select>\u003c/div>\n    \u003c/div>\n    \u003clabel>Ghi chú\u003c/label>\u003cinput id=\"fNote\" value=\"${esc(t.note || '')}\">`;\n}\nfunction readForm() {\n  return { description: $('fDesc').value, amount: digits($('fAmt').value), date: $('fDate').value,\n    category: $('fCat').value, method: $('fMethod').value, note: $('fNote').value };\n}\nfunction openModal(html) { $('modalBody').innerHTML = html; $('modal').classList.remove('hidden'); }\nfunction closeModal() { $('modal').classList.add('hidden'); }\n\nfunction openManual() {\n  openModal('\u003ch2>Nhập tay\u003c/h2>' + txForm({}) +\n    '\u003cdiv class=\"row\" style=\"margin-top:14px\">\u003cspan class=\"grow\">\u003c/span>\u003cbutton class=\"ghost\" onclick=\"closeModal()\">Hủy\u003c/button>\u003cbutton class=\"primary\" id=\"btnM\" onclick=\"saveManual()\">Lưu\u003c/button>\u003c/div>');\n  setTimeout(() => $('fAmt').focus(), 50);\n}\nasync function saveManual() {\n  const t = readForm(); if (!t.amount) { toast('Nhập số tiền'); return; }\n  const btn = $('btnM'); busy(btn, true);\n  try {\n    const ids = await api('addTransactions', [t]); closeModal(); invalidate(); refreshCurrent();\n    toast('Đã lưu ✓', 0, { label: 'Hoàn tác', fn: () => undoAdd(ids) });\n  }\n  catch (e) { fail(e); busy(btn, false); }\n}\n\nfunction openEdit(t) {\n  if (!t) return;\n  S.editing = t;\n  openModal('\u003ch2>Sửa khoản chi\u003c/h2>' + txForm(t) +\n    '\u003cdiv class=\"row\" style=\"margin-top:14px\">\u003cbutton class=\"danger\" id=\"btnDel\" onclick=\"delTx()\">Xóa\u003c/button>\u003cspan class=\"grow\">\u003c/span>\u003cbutton class=\"ghost\" onclick=\"closeModal()\">Hủy\u003c/button>\u003cbutton class=\"primary\" id=\"btnE\" onclick=\"saveEdit()\">Lưu\u003c/button>\u003c/div>');\n}\nasync function saveEdit() {\n  const t = Object.assign(readForm(), { id: S.editing.id }); if (!t.amount) { toast('Nhập số tiền'); return; }\n  const btn = $('btnE'); busy(btn, true);\n  try { await api('updateTransaction', t); closeModal(); invalidate(); toast('Đã cập nhật ✓'); refreshCurrent(); }\n  catch (e) { fail(e); busy(btn, false); }\n}\nasync function delTx() {\n  const btn = $('btnDel');\n  if (!btn.dataset.armed) { btn.dataset.armed = '1'; btn.textContent = 'Bấm lần nữa để xóa'; return; }\n  if (btn.dataset.busy) return;            // chạm nhanh 2 lần: chỉ gửi 1 lệnh xóa\n  btn.dataset.busy = '1'; busy(btn, true);\n  try {\n    const tx = await api('deleteTransaction', S.editing.id); closeModal(); invalidate(); refreshCurrent();\n    toast('Đã xóa \"' + (tx && (tx.description || tx.category) || 'khoản chi') + '\"', 0, tx && { label: 'Hoàn tác', fn: () => undoDelete(tx) });\n  } catch (e) { fail(e); delete btn.dataset.busy; busy(btn, false); }\n}\nasync function undoAdd(ids) {\n  try {\n    const n = await api('deleteTransactions', ids); invalidate(); refreshCurrent();\n    toast(n ? 'Đã hoàn tác' : 'Không hoàn tác được: không tìm thấy khoản vừa lưu. Hãy xóa thủ công trong Lịch sử.', n ? 0 : 5000);\n  } catch (e) { fail(e); }\n}\nasync function undoDelete(tx) {\n  try { await api('addTransactions', [tx]); invalidate(); refreshCurrent(); toast('Đã khôi phục ✓'); } catch (e) { fail(e); }\n}\nfunction refreshCurrent() {\n  const b = document.querySelector('nav button.active'); go(b ? b.dataset.tab : 'add');\n}\n\n/* ---------------- Tổng quan ---------------- */\n/**\n * Dải tháng: mỗi ô = tên tháng + tổng chi + thanh mini (so với tháng chi nhiều nhất).\n * Bấm là chọn ngay (tô màu trước, tải dữ liệu sau) và tự cuộn để ô đang chọn nằm giữa.\n */\nfunction renderStrip(id, months, sel, pick) {\n  S.pick = S.pick || {}; S.pick[id] = pick;\n  const strip = $(id), cur = S.init.today.slice(0, 7);\n  const max = Math.max.apply(null, months.map(m => m.spend).concat([1]));\n  strip.innerHTML = months.map((m, i) => {\n    const mo = +m.ym.slice(5), yy = m.ym.slice(2, 4);\n    const label = m.ym === cur ? 'Tháng này' : 'T' + mo + (mo === 1 || i === 0 ? \"/\" + yy : '');\n    return `\u003cbutton type=\"button\" role=\"tab\" class=\"mchip${m.ym === sel ? ' on' : ''}${m.ym === cur ? ' now' : ''}\" aria-selected=\"${m.ym === sel}\" data-ym=\"${m.ym}\"\n      aria-label=\"${ymLabel(m.ym)}: chi ${vnd(m.spend)}\" onclick=\"stripPick('${id}', '${m.ym}')\">\n      \u003cspan>${label}\u003c/span>\u003csmall class=\"num\">${m.spend ? short(m.spend) : '—'}\u003c/small>\n      \u003cspan class=\"mbar\">\u003ci style=\"width:${Math.round(m.spend / max * 100)}%\">\u003c/i>\u003c/span>\u003c/button>`;\n  }).join('');\n  centerStrip(id);\n}\nfunction centerStrip(id) {\n  const strip = $(id), on = strip.querySelector('.on');\n  strip.scrollLeft = on ? on.offsetLeft - strip.clientWidth / 2 + on.offsetWidth / 2 : strip.scrollWidth;\n  stripFade(strip);\n}\nfunction stripFade(strip) { strip.classList.toggle('more', strip.scrollLeft > 4); }\nfunction stripPick(id, ym) {\n  $(id).querySelectorAll('.mchip').forEach(b => { b.classList.toggle('on', b.dataset.ym === ym); b.setAttribute('aria-selected', b.dataset.ym === ym); });\n  centerStrip(id);\n  S.pick[id](ym);\n}\nfunction pickDashMonth(ym) { S.dashMonth = ym; loadDash(); }\nfunction pickHistMonth(ym) { $('hMonth').value = ym; loadHistory(); }\n\nasync function loadDash() {\n  const ym = S.dashMonth;\n  $('dashMonth').textContent = ymLabel(ym);\n  if (!CACHE['dash|' + ym]) $('dash').innerHTML = '\u003cdiv class=\"empty\">\u003cspan class=\"spin\">\u003c/span>\u003c/div>';\n  try { await cachedCall('dash|' + ym, 'getDashboard', [ym], renderDash, () => ym === S.dashMonth); } catch (e) { fail(e); }\n}\n\nfunction renderDash(d) {\n  if (d.months) renderStrip('dashStrip', d.months, d.month, pickDashMonth);\n  if (!d.count && !(d.savings && d.savings.total)) {\n    $('dash').innerHTML = `\u003cdiv class=\"card empty\">${ymLabel(d.month)} chưa có khoản chi nào.\u003cbr>\n      \u003cbutton style=\"margin-top:10px\" onclick=\"go('add')\">Ghi khoản chi\u003c/button>\u003c/div>`;\n    return;\n  }\n  const pctBudget = d.budget ? d.total / d.budget * 100 : 0;\n  const delta = d.prevSamePeriod ? (d.total - d.prevSamePeriod) / d.prevSamePeriod * 100 : null;\n  const fullMonth = d.daysElapsed >= d.daysInMonth;\n  const remain = d.budget - d.total;\n  const kpi = (label, value, sub, cls) => `\u003cdiv class=\"kpi\">\u003cdiv class=\"s\">${label}\u003c/div>\u003cdiv class=\"v num ${cls || ''}\">${value}\u003c/div>\u003cdiv class=\"s\">${sub}\u003c/div>\u003c/div>`;\n\n  let html = '\u003cdiv class=\"kpis\">' +\n    kpi('Tổng chi', vnd(d.total), d.count + ' giao dịch') +\n    kpi('Ngân sách còn', vnd(remain), Math.round(pctBudget) + '% đã dùng', remain \u003c 0 ? 'up' : '') +\n    kpi(fullMonth ? 'So tháng trước' : 'So cùng kỳ tháng trước',\n        delta == null ? '—' : Math.abs(delta) \u003c 0.5 ? '≈ 0%' : (delta > 0 ? '▲ ' : '▼ ') + Math.abs(Math.round(delta)) + '%',\n        (fullMonth ? 'Tháng trước ' : 'Ngày 1–' + d.daysElapsed + ': ') + short(d.prevSamePeriod),\n        delta == null || Math.abs(delta) \u003c 0.5 ? '' : delta > 0 ? 'up' : 'down') +\n    kpi('Chi thường / ngày', vnd(d.avgPerDay), d.daysElapsed && d.daysElapsed \u003c d.daysInMonth ? 'Dự báo ' + short(d.forecast) : d.daysElapsed + ' ngày') +\n    '\u003c/div>';\n\n  const sv = d.savings;\n  if (sv && (sv.total || sv.target)) {\n    const pct = sv.target ? Math.round(sv.total / sv.target * 100) : 0;\n    html += `\u003cdiv class=\"card\">\u003cdiv class=\"row\">\n        \u003ch2 class=\"grow\" style=\"margin:0\">💰 Để dành\u003c/h2>\n        \u003cspan class=\"num\">\u003cb>${vnd(sv.total)}\u003c/b>${sv.target ? ' \u003cspan class=\"muted\">/ mục tiêu ' + short(sv.target) + '\u003c/span>' : ''}\u003c/span>\u003c/div>\n      ${sv.target ? `\u003cdiv class=\"bar\">\u003ci style=\"width:${Math.min(100, pct)}%\">\u003c/i>\u003c/div>\n        \u003cdiv class=\"muted\" style=\"margin-top:6px\">${pct >= 100 ? 'Đã đạt mục tiêu ✓' : 'Còn ' + vnd(sv.target - sv.total) + ' để đạt mục tiêu (' + pct + '%)'}. Không tính vào tổng chi.\u003c/div>`\n        : '\u003cdiv class=\"muted\" style=\"margin-top:6px\">Chưa đặt mục tiêu. Không tính vào tổng chi.\u003c/div>'}\n      ${sv.categories.length > 1 ? sv.categories.map(c => `\u003cdiv class=\"row muted\" style=\"margin-top:4px\">\u003cspan class=\"grow\">${esc(c.icon)} ${esc(c.name)}\u003c/span>\u003cspan class=\"num\">${vnd(c.amount)}${c.target ? ' / ' + short(c.target) : ''}\u003c/span>\u003c/div>`).join('') : ''}\n    \u003c/div>`;\n  }\n  if (d.offBudget && d.offBudget.total) {\n    const ob = d.offBudget, names = ob.categories.map(c => esc(c.name) + ' ' + short(c.amount)).join(', ');\n    html += `\u003cdiv class=\"card row\" style=\"border-color:var(--warn);align-items:flex-start\">\n      \u003cspan class=\"pill off\" style=\"margin-top:2px\">Ngoài ngân sách\u003c/span>\n      \u003cspan class=\"grow\">Đã chi \u003cb class=\"num\">${vnd(ob.total)}\u003c/b> ở ${ob.categories.length} danh mục chưa có hạn mức: ${names}.\n        \u003ca href=\"#\" onclick=\"S.budMonth=S.dashMonth;go('budget');return false\" style=\"color:var(--brand)\">Đặt hạn mức\u003c/a>\u003c/span>\u003c/div>`;\n  }\n  if (d.daysElapsed && d.daysElapsed \u003c d.daysInMonth && d.budget && d.forecast > d.budget) {\n    html += `\u003cdiv class=\"card\" style=\"border-color:var(--warn)\">⚠️ Với tốc độ hiện tại, cuối tháng sẽ chi khoảng \u003cb>${vnd(d.forecast)}\u003c/b>, vượt ngân sách \u003cb>${vnd(d.forecast - d.budget)}\u003c/b>.\u003c/div>`;\n  }\n\n  html += donutCard(d);\n\n  html += '\u003cdiv class=\"card\">\u003ch2>Theo danh mục\u003c/h2>' + (d.byCategory.filter(c => c.amount || c.budget).map(c => {\n    const p = c.budget ? c.amount / c.budget * 100 : (c.amount ? 100 : 0);\n    const cls = p > 100 ? 'bad' : p >= 80 ? 'warn' : '';\n    return `\u003cdiv class=\"cat-row\">\u003cdiv class=\"row\">\n        \u003cspan>${esc(c.icon)}\u003c/span>\u003cspan class=\"grow\">${esc(c.name)}\u003c/span>\n        \u003cspan class=\"num\">\u003cb>${vnd(c.amount)}\u003c/b> ${c.budget ? '\u003cspan class=\"muted\">/ ' + short(c.budget) + '\u003c/span>' : '\u003cspan class=\"pill off\">Ngoài ngân sách\u003c/span>'}\u003c/span>\u003c/div>\n        \u003cdiv class=\"bar\">\u003ci class=\"${c.budget ? cls : 'off'}\" style=\"width:${Math.min(100, p)}%\">\u003c/i>\u003c/div>\u003c/div>`;\n  }).join('') || '\u003cdiv class=\"empty\">Chưa có dữ liệu\u003c/div>') + '\u003c/div>';\n\n  const bi = d.bigItems || { count: 0 };\n  html += '\u003cdiv class=\"card\">\u003ch2>Chi thường ngày theo ngày\u003c/h2>' + dailyChart(d.dailyRoutine || d.daily) +\n    (bi.count ? `\u003cdiv class=\"muted\" style=\"margin-top:6px\">Không tính ${bi.count} khoản lớn từ ${short(bi.threshold)} trở lên (tổng ${vnd(bi.total)}), xem ở \"5 khoản lớn nhất\".\u003c/div>` : '') + '\u003c/div>';\n\n  html += '\u003cdiv class=\"card\">\u003ch2>5 khoản lớn nhất\u003c/h2>' + (d.top.length ? d.top.map(txRow).join('') : '\u003cdiv class=\"empty\">—\u003c/div>') + '\u003c/div>';\n\n  html += `\u003cdiv class=\"card\">\u003cdiv class=\"row\">\u003ch2 class=\"grow\" style=\"margin:0\">🤖 Nhận xét tháng\u003c/h2>\n    \u003cbutton id=\"btnReview\" onclick=\"doReview()\">${S.init.aiName ? 'Hỏi ' + esc(S.init.aiName) : 'Tạo nhận xét'}\u003c/button>\u003c/div>\n    \u003cdiv id=\"review\" class=\"review\" style=\"margin-top:10px\">\u003c/div>\u003c/div>`;\n\n  $('dash').innerHTML = html;\n  const topBox = $('dash').querySelectorAll('.card')[$('dash').querySelectorAll('.card').length - 2];\n  bindTx(topBox, d.top);\n}\n\n/* ---------- Biểu đồ tròn: cơ cấu chi tiêu tháng theo danh mục ---------- */\nfunction donutCard(d) {\n  const items = d.byCategory.filter(c => c.amount > 0);   // byCategory chỉ gồm danh mục Chi tiêu, đã xếp giảm dần\n  const total = items.reduce((s, c) => s + c.amount, 0);\n  if (!total) return '';\n  // Tối đa 5 phần + 1 phần \"Còn lại\" để vẫn đọc được bằng mắt. Màu gán theo thứ tự trên vòng (lớn → nhỏ):\n  // các màu nằm cạnh nhau luôn là cặp đã kiểm tra; tên danh mục luôn hiện ở chú thích nên không phải đoán theo màu.\n  const segs = []; let other = 0, otherN = 0;\n  items.forEach(c => {\n    if (segs.length \u003c 5) segs.push({ name: c.name, icon: c.icon, amount: c.amount, color: 'var(--c' + (segs.length + 1) + ')' });\n    else { other += c.amount; otherN++; }\n  });\n  if (other) segs.push({ name: 'Còn lại · ' + otherN + ' danh mục', icon: '', amount: other, color: 'var(--c-other)' });\n  S.donut = { segs: segs, total: total, month: d.month };\n  const R = 62, C = 2 * Math.PI * R, gap = segs.length > 1 ? 2.5 : 0;\n  let start = 0;\n  const circles = segs.map((g, i) => {\n    const len = g.amount / total * C, dash = Math.max(len - gap, 0.8);\n    const el = `\u003ccircle class=\"seg\" data-i=\"${i}\" cx=\"90\" cy=\"90\" r=\"${R}\" fill=\"none\" stroke=\"${g.color}\" stroke-width=\"24\"\n      stroke-dasharray=\"${dash.toFixed(2)} ${(C - dash).toFixed(2)}\" stroke-dashoffset=\"${(-start).toFixed(2)}\"\n      transform=\"rotate(-90 90 90)\" onclick=\"donutPick(${i})\">\u003ctitle>${esc(g.name)}: ${vnd(g.amount)} (${pct(g.amount, total)})\u003c/title>\u003c/circle>`;\n    start += len;\n    return el;\n  }).join('');\n  return `\u003cdiv class=\"card\">\u003ch2>Cơ cấu chi tiêu\u003c/h2>\u003cdiv class=\"donut-wrap\">\n    \u003csvg class=\"donut\" id=\"donut\" viewBox=\"0 0 180 180\" role=\"img\" aria-label=\"Biểu đồ tròn chi tiêu ${ymLabel(d.month)} theo danh mục\">\n      \u003ccircle cx=\"90\" cy=\"90\" r=\"${R}\" fill=\"none\" stroke=\"var(--bg)\" stroke-width=\"24\"/>${circles}\n      \u003ctext x=\"90\" y=\"86\" class=\"cv num\" id=\"donutValue\">${short(total)}\u003c/text>\n      \u003ctext x=\"90\" y=\"104\" class=\"cl\" id=\"donutLabel\">tổng chi\u003c/text>\n    \u003c/svg>\n    \u003cdiv class=\"legend\" id=\"donutLegend\">${segs.map((g, i) => `\u003cbutton type=\"button\" data-i=\"${i}\" onclick=\"donutPick(${i})\">\n      \u003cspan class=\"sw\" style=\"background:${g.color}\">\u003c/span>\u003cspan class=\"nm\">${g.icon ? esc(g.icon) + ' ' : ''}${esc(g.name)}\u003c/span>\n      \u003cspan class=\"pc\">${pct(g.amount, total)}\u003c/span>\u003cspan class=\"am num\">${short(g.amount)}\u003c/span>\u003c/button>`).join('')}\u003c/div>\n  \u003c/div>\u003cdiv class=\"muted\" style=\"margin-top:6px\">Chạm vào một phần để xem chi tiết. Không gồm tiền để dành.\u003c/div>\u003c/div>`;\n}\nconst pct = (a, t) => { const p = a / t * 100; return p \u003c 1 ? '\u003c1%' : Math.round(p) + '%'; };\n/** Chạm một phần (hoặc dòng chú thích): làm nổi phần đó, giữa vòng hiện tên + số tiền; chạm lại để bỏ chọn. */\nfunction donutPick(i) {\n  const svg = $('donut'), D = S.donut;\n  const same = svg.dataset.sel === String(i);\n  svg.dataset.sel = same ? '' : String(i);\n  svg.classList.toggle('focus', !same);\n  svg.querySelectorAll('circle.seg').forEach(c => c.classList.toggle('on', !same && c.dataset.i === String(i)));\n  $('donutLegend').querySelectorAll('button').forEach(b => b.classList.toggle('on', !same && b.dataset.i === String(i)));\n  const g = D.segs[i];\n  $('donutValue').textContent = same ? short(D.total) : short(g.amount);\n  $('donutLabel').textContent = same ? 'tổng chi' : (g.name.length > 16 ? g.name.slice(0, 15) + '…' : g.name) + ' · ' + pct(g.amount, D.total);\n}\n\nfunction dailyChart(daily) {\n  const max = Math.max.apply(null, daily.concat([1]));\n  const n = daily.length, w = 100 / n;\n  const bars = daily.map((v, i) => {\n    const h = v / max * 100;\n    return `\u003crect x=\"${i * w + w * 0.15}\" y=\"${100 - h}\" width=\"${w * 0.7}\" height=\"${h}\" rx=\"0.6\" fill=\"var(--brand)\" opacity=\"${v ? 1 : 0}\">\u003ctitle>Ngày ${i + 1}: ${vnd(v)}\u003c/title>\u003c/rect>`;\n  }).join('');\n  return `\u003csvg class=\"chart\" viewBox=\"0 0 100 100\" preserveAspectRatio=\"none\">${bars}\u003c/svg>\n    \u003cdiv class=\"row muted\" style=\"font-size:11px\">\u003cspan class=\"grow\">1\u003c/span>\u003cspan class=\"grow\" style=\"text-align:center\">${Math.ceil(n / 2)}\u003c/span>\u003cspan>${n}\u003c/span>\u003c/div>\n    \u003cdiv class=\"muted\" style=\"font-size:12px;margin-top:4px\">Cao nhất: ${vnd(max === 1 ? 0 : max)}/ngày\u003c/div>`;\n}\n\nasync function doReview() {\n  const btn = $('btnReview'); busy(btn, true, 'Đang phân tích');\n  try { $('review').innerHTML = md(await api('monthlyReview', S.dashMonth)); }\n  catch (e) { fail(e); } finally { busy(btn, false); }\n}\n\n/** Markdown tối giản: ##, -, **bold** (đã escape HTML trước). */\nfunction md(text) {\n  const out = []; let inList = false;\n  esc(text).split('\\n').forEach(line => {\n    const l = line.trim().replace(/\\*\\*(.+?)\\*\\*/g, '\u003cb>$1\u003c/b>');\n    if (/^[-*•]\\s+/.test(l)) { if (!inList) { out.push('\u003cul>'); inList = true; } out.push('\u003cli>' + l.replace(/^[-*•]\\s+/, '') + '\u003c/li>'); return; }\n    if (inList) { out.push('\u003c/ul>'); inList = false; }\n    if (/^#{1,3}\\s+/.test(l)) out.push('\u003ch3>' + l.replace(/^#{1,3}\\s+/, '') + '\u003c/h3>');\n    else if (l) out.push('\u003cp>' + l + '\u003c/p>');\n  });\n  if (inList) out.push('\u003c/ul>');\n  return out.join('');\n}\n\n/* ---------------- Lịch sử ---------------- */\nlet hTimer;\nfunction debounceHistory() { clearTimeout(hTimer); hTimer = setTimeout(loadHistory, 350); }\n\nlet histMode = 'month', histReq = 0;\nfunction setHistMode(m) {\n  histMode = m;\n  $('hMode').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === m));\n  $('hMonthBox').classList.toggle('hidden', m !== 'month');\n  $('hRangeBox').classList.toggle('hidden', m !== 'range');\n  if (m === 'range' && !$('hFrom').value) {\n    // Mặc định: từ ngày 1 của tháng đang xem đến hôm nay (hoặc cuối tháng đó)\n    const ym = $('hMonth').value || S.init.today.slice(0, 7);\n    $('hFrom').value = ym + '-01';\n    $('hTo').value = ym === S.init.today.slice(0, 7) ? S.init.today : ym + '-' + new Date(+ym.slice(0, 4), +ym.slice(5), 0).getDate();\n  }\n  loadHistory();\n}\n/** Bộ chọn tháng: lưới 12 tháng + chuyển năm. Không cho chọn tháng tương lai. */\n/** ahead: số tháng tương lai được phép chọn (ngân sách có thể đặt trước cho tháng sau). */\nfunction pickMonth(cur, onPick, ahead) {\n  cur = cur || S.init.today.slice(0, 7);\n  let year = +cur.slice(0, 4);\n  const maxYm = addMonths(S.init.today.slice(0, 7), ahead || 0);\n  const draw = () => {\n    const ym = m => year + '-' + String(m).padStart(2, '0');\n    $('mpYear').textContent = 'Năm ' + year;\n    $('mpNext').disabled = year >= +maxYm.slice(0, 4);\n    $('mpGrid').innerHTML = Array.from({ length: 12 }, (_, i) => i + 1).map(m =>\n      `\u003cbutton type=\"button\" class=\"${ym(m) === cur ? 'on' : ''}\" ${ym(m) > maxYm ? 'disabled' : ''} data-ym=\"${ym(m)}\">Th ${m}\u003c/button>`).join('');\n    $('mpGrid').querySelectorAll('button').forEach(b => b.onclick = () => { closeModal(); onPick(b.dataset.ym); });\n  };\n  openModal(`\u003cdiv class=\"row\">\u003ch2 class=\"grow\" style=\"margin:0\">Chọn tháng\u003c/h2>\u003cbutton class=\"ghost\" onclick=\"closeModal()\">Đóng\u003c/button>\u003c/div>\n    \u003cdiv class=\"row\" style=\"justify-content:space-between;margin-top:6px\">\n      \u003cbutton class=\"ghost\" id=\"mpPrev\" aria-label=\"Năm trước\">‹\u003c/button>\u003cstrong id=\"mpYear\">\u003c/strong>\n      \u003cbutton class=\"ghost\" id=\"mpNext\" aria-label=\"Năm sau\">›\u003c/button>\u003c/div>\n    \u003cdiv class=\"mp-grid\" id=\"mpGrid\">\u003c/div>`);\n  $('mpPrev').onclick = () => { year--; draw(); };\n  $('mpNext').onclick = () => { year++; draw(); };\n  draw();\n}\nconst dmy = ymd => ymd.slice(8) + '/' + ymd.slice(5, 7) + '/' + ymd.slice(0, 4);\n\nasync function loadHistory() {\n  const req = ++histReq;\n  if (histMode === 'month') {\n    // Tháng đang xem cũ hơn dải mặc định thì xin server kéo dài dải tới tháng đó\n    const sel = $('hMonth').value, base = CACHE.months && CACHE.months.data;\n    const inBase = !base || base.some(m => m.ym === sel);\n    const key = inBase ? 'months' : 'months|' + sel;\n    cachedCall(key, 'getMonthTotals', inBase ? [] : [sel], m => renderStrip('histStrip', m, $('hMonth').value, pickHistMonth)).catch(fail);\n  }\n  try {\n    let from = '', to = '', period;\n    if (histMode === 'range') {\n      from = $('hFrom').value; to = $('hTo').value;\n      if (from && to && from > to) { $('hFrom').value = to; $('hTo').value = from; from = $('hFrom').value; to = $('hTo').value; }\n      period = (from ? dmy(from) : '…') + ' → ' + (to ? dmy(to) : '…');\n    } else {\n      period = ymLabel($('hMonth').value || S.init.today.slice(0, 7));\n    }\n    const args = [histMode === 'month' ? $('hMonth').value : '', $('hCat').value, $('hQ').value, from, to];\n    const key = 'hist|' + JSON.stringify(args);\n    if (!CACHE[key]) $('hist').innerHTML = '\u003cdiv class=\"empty\">\u003cspan class=\"spin\">\u003c/span>\u003c/div>';\n    await cachedCall(key, 'getTransactions', args, list => renderHistory(list, period), () => req === histReq);\n  } catch (e) { fail(e); }\n}\nfunction renderHistory(list, period) {\n    $('hSummary').innerHTML = esc(period) + ': ' + sumText(list);\n    if (!list.length) { $('hist').innerHTML = '\u003cdiv class=\"empty\">Không có giao dịch phù hợp\u003c/div>'; return; }\n    $('hist').innerHTML = groupByDay(list);\n    bindTx($('hist'), list);\n}\n\n/* ---------------- Thêm nhanh danh mục khi đang ghi ---------------- */\nlet qaTarget = null;\nfunction catChanged(el) {\n  if (el.value === '__new__') { openQuickCat(el); return; }\n  el.dataset.prev = el.value;\n  if (el.dataset.pi != null) S.preview[+el.dataset.pi].category = el.value;\n}\nfunction openQuickCat(el) {\n  qaTarget = el;\n  $('qaName').value = ''; $('qaIcon').value = '📌';\n  $('qaIcons').innerHTML = ICONS.map(x => `\u003cbutton type=\"button\" onclick=\"$('qaIcon').value='${x}'\">${x}\u003c/button>`).join('');\n  $('qaModal').classList.remove('hidden');\n  setTimeout(() => $('qaName').focus(), 50);\n}\nfunction cancelQuickCat() {\n  if (qaTarget) qaTarget.value = qaTarget.dataset.prev || '';\n  qaTarget = null; $('qaModal').classList.add('hidden');\n}\nasync function saveQuickCat() {\n  const name = $('qaName').value.trim();\n  if (!name) { toast('Hãy nhập tên danh mục'); $('qaName').focus(); return; }\n  const btn = $('btnQa'); busy(btn, true);\n  try {\n    const r = await api('saveCategory', { name: name, icon: $('qaIcon').value, budget: 0, keywords: '' });\n    invalidate(); await refreshInit();\n    // Cập nhật mọi ô chọn danh mục đang mở, giữ nguyên lựa chọn cũ; ô vừa bấm chọn danh mục mới\n    document.querySelectorAll('select.cat-sel').forEach(sel => {\n      const v = sel === qaTarget ? r.name : (sel.dataset.prev || sel.value);\n      sel.innerHTML = catOptions(v) + '\u003coption value=\"__new__\">＋ Thêm danh mục mới…\u003c/option>';\n      sel.value = v; catChanged(sel);\n    });\n    qaTarget = null; $('qaModal').classList.add('hidden');\n    toast('Đã thêm \"' + r.name + '\" ✓');\n  } catch (e) { fail(e); } finally { busy(btn, false); }\n}\n\n/* ---------------- Ngân sách & danh mục ---------------- */\nconst addMonths = (ym, n) => { const d = new Date(+ym.slice(0, 4), +ym.slice(5) - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };\nfunction pickBudMonth(ym) { S.budMonth = ym; renderBudgets(); }\n\nasync function renderBudgets() {\n  S.budMonth = S.budMonth || S.init.today.slice(0, 7);\n  const month = S.budMonth, key = 'cats|' + month;\n  $('budMonthLabel').textContent = ymLabel(month);\n  $('budCardTitle').textContent = 'Hạn mức ' + ymLabel(month).toLowerCase();\n  $('sheetLink').href = S.init.sheetUrl || '#';\n  $('sheetLink').parentNode.classList.toggle('hidden', !S.init.sheetUrl);\n  // Dải tháng: các tháng đã có + 3 tháng tới (để đặt ngân sách trước)\n  cachedCall('months', 'getMonthTotals', [], base => {\n    const months = base.slice(), last = months.length ? months[months.length - 1].ym : S.init.today.slice(0, 7);\n    for (let i = 1; i \u003c= 3; i++) months.push({ ym: addMonths(last, i), spend: 0 });\n    if (!months.some(m => m.ym === month)) { months.push({ ym: month, spend: 0 }); months.sort((x, y) => x.ym \u003c y.ym ? -1 : 1); }\n    renderStrip('budStrip', months, month, pickBudMonth);\n  }).catch(fail);\n  if (!CACHE[key]) $('budgetList').innerHTML = '\u003cdiv class=\"empty\">\u003cspan class=\"spin\">\u003c/span>\u003c/div>';\n  try {\n    await cachedCall(key, 'getCategoryList', [month], list => {\n      if (month !== S.budMonth) return;\n      if (document.activeElement && document.activeElement.closest && document.activeElement.closest('#budgetList')) return; // đang gõ thì không vẽ lại\n      S.catList = list;\n      $('budgetList').innerHTML = S.catList.map((c, i) => `\n        \u003cdiv class=\"cat-row row click\" data-i=\"${i}\" onclick=\"if(!event.target.closest('input,button'))openCategory(${i})\">\n          \u003cspan>${esc(c.icon)}\u003c/span>\n          \u003cspan class=\"grow cat-name\">\u003cspan>${esc(c.name)} \u003cspan class=\"def\" aria-hidden=\"true\">✎\u003c/span>\u003c/span>\n            \u003csmall>${c.count} khoản ${c.kind === 'save' ? '\u003cspan class=\"pill save\">Để dành · mục tiêu\u003c/span>' : statusPill(c.budget)}\n              \u003cspan class=\"ovrinfo\">${ovrInfo(c)}\u003c/span>\u003c/small>\u003c/span>\n          \u003cinput class=\"num${c.overridden ? ' ovr' : ''}\" style=\"max-width:120px;text-align:right\" inputmode=\"numeric\" data-name=\"${esc(c.name)}\" data-kind=\"${c.kind}\"\n            aria-label=\"${c.kind === 'save' ? 'Mục tiêu để dành' : 'Ngân sách'} ${esc(c.name)} ${ymLabel(month)}\"\n            value=\"${c.budget.toLocaleString('vi-VN')}\" data-saved=\"${c.budget}\" onblur=\"fmtInput(this)\" oninput=\"updBudgetTotal()\" onchange=\"saveOneBudget(this)\">\n          \u003cbutton class=\"ghost reset${c.overridden ? '' : ' hidden'}\" title=\"Về mặc định\" aria-label=\"Đưa ${esc(c.name)} về mặc định\" onclick=\"resetMonthBudget(${i})\">↺\u003c/button>\u003c/div>`).join('');\n      updBudgetTotal();\n    }, () => month === S.budMonth);\n  } catch (e) { fail(e); }\n}\nfunction ovrInfo(c) {\n  return c.overridden ? '\u003cspan class=\"pill ovr\">Riêng tháng này\u003c/span> \u003cspan class=\"def\">mặc định ' + short(c.defaultBudget) + '\u003c/span>' : '';\n}\n/** Tự lưu hạn mức của 1 danh mục cho THÁNG ĐANG CHỌN khi rời ô nhập. */\nasync function saveOneBudget(el) {\n  const name = el.dataset.name, budget = digits(el.value), month = S.budMonth;\n  if (String(budget) === el.dataset.saved) return;\n  try {\n    const r = await api('setMonthBudget', month, name, budget);\n    el.dataset.saved = String(budget);\n    const c = S.catList.find(x => x.name === name);\n    if (c) { c.budget = r.budget; c.overridden = r.overridden; updateBudgetRow(el, c); }\n    invalidate();\n    toast(name + ' · ' + ymLabel(month) + ': ' + vnd(budget) + (r.overridden ? ' (mặc định ' + short(r.defaultBudget) + ')' : ' = mặc định') + ' ✓');\n  } catch (e) { fail(e); }\n}\nfunction updateBudgetRow(el, c) {\n  const row = el.closest('.cat-row');\n  row.querySelector('.ovrinfo').innerHTML = ovrInfo(c);\n  row.querySelector('.reset').classList.toggle('hidden', !c.overridden);\n  el.classList.toggle('ovr', c.overridden);\n  updBudgetTotal();\n}\nasync function resetMonthBudget(i) {\n  const c = S.catList[i], month = S.budMonth;\n  try {\n    await api('setMonthBudget', month, c.name, c.defaultBudget);\n    invalidate(); renderBudgets();\n    toast(c.name + ' · ' + ymLabel(month) + ' về mặc định ' + vnd(c.defaultBudget) + ' ✓');\n  } catch (e) { fail(e); }\n}\nasync function applyAsDefault() {\n  const month = S.budMonth, btn = $('btnApply'); busy(btn, true);\n  try {\n    const n = await api('applyMonthAsDefault', month);\n    invalidate(); await refreshInit(); renderBudgets();\n    toast('Đã dùng ' + n + ' hạn mức của ' + ymLabel(month) + ' làm mặc định ✓');\n  } catch (e) { fail(e); } finally { busy(btn, false); }\n}\n/** Trạng thái tự động theo ngân sách: > 0 là đã duyệt, = 0 là ngoài ngân sách. */\nfunction statusPill(budget) {\n  return budget > 0 ? '\u003cspan class=\"pill ok\">Đã duyệt\u003c/span>' : '\u003cspan class=\"pill off\">Ngoài ngân sách\u003c/span>';\n}\nfunction updBudgetTotal() {\n  const all = Array.from($('budgetList').querySelectorAll('input'));\n  const inputs = all.filter(el => el.dataset.kind !== 'save');\n  const saves = all.filter(el => el.dataset.kind === 'save');\n  let approved = 0;\n  inputs.forEach(el => {\n    const b = digits(el.value); if (b > 0) approved++;\n    const pill = el.closest('.cat-row').querySelector('.pill');\n    if (pill) pill.outerHTML = statusPill(b); // đổi trạng thái ngay khi gõ hạn mức\n  });\n  const saveTotal = saves.reduce((s, el) => s + digits(el.value), 0);\n  $('budgetTotal').innerHTML = vnd(inputs.reduce((s, el) => s + digits(el.value), 0)) +\n    (saves.length ? '\u003c/b>\u003cbr>Mục tiêu để dành: \u003cb class=\"num\">' + vnd(saveTotal) : '');\n  $('budgetStatus').innerHTML = statusPill(1) + ' ' + approved + ' danh mục &nbsp; ' + statusPill(0) + ' ' + (inputs.length - approved) +\n    ' danh mục · Nhập hạn mức > 0 để duyệt.';\n  const ovr = (S.catList || []).filter(c => c.overridden);\n  $('applyBox').classList.toggle('hidden', !ovr.length);\n  if (ovr.length) $('applyText').textContent = ymLabel(S.budMonth) + ' có ' + ovr.length + ' hạn mức chỉnh riêng (' +\n    ovr.map(c => c.name).join(', ') + '). Muốn áp dụng luôn cho các tháng sau? Các tháng trước giữ nguyên.';\n}\n\n/** Nạp lại danh mục sau khi thêm/sửa/xóa để màn Ghi, Lịch sử, Tổng quan dùng bản mới. */\nasync function refreshInit() {\n  const keepCat = $('hCat').value;\n  S.init = await api('getInitData');\n  S.cats = {}; S.init.categories.forEach(c => { S.cats[c.name] = c; });\n  $('hCat').innerHTML = '\u003coption value=\"\">Mọi danh mục\u003c/option>' + catOptions(keepCat);\n}\n\nconst ICONS = ['🍜', '☕', '🛵', '🚗', '🏠', '💡', '🛍️', '💄', '💊', '🏋️', '📚', '🎓', '🎬', '✈️', '🎁', '👶', '🐶', '💼', '📱', '💰', '❤️', '🧾', '📌'];\n\nfunction openCategory(i) {\n  const c = i == null ? { name: '', icon: '📌', budget: 0, keywords: '', count: 0, kind: 'spend' } : S.catList[i];\n  const isNew = i == null, isFallback = c.name === 'Khác';\n  S.editingCat = c;\n  openModal(`\u003ch2>${isNew ? 'Thêm danh mục' : 'Sửa danh mục'}\u003c/h2>\n    \u003clabel for=\"cName\">Tên danh mục\u003c/label>\n    \u003cinput id=\"cName\" maxlength=\"40\" value=\"${esc(c.name)}\" placeholder=\"Ví dụ: Thể thao\" ${isFallback ? 'disabled' : ''}>\n    \u003clabel for=\"cIcon\">Icon\u003c/label>\n    \u003cdiv class=\"row\" style=\"align-items:flex-start\">\n      \u003cinput id=\"cIcon\" value=\"${esc(c.icon)}\" style=\"max-width:64px;text-align:center;font-size:20px\" maxlength=\"8\">\n      \u003cdiv class=\"icon-pick grow\">${ICONS.map(x => `\u003cbutton type=\"button\" onclick=\"$('cIcon').value='${x}'\">${x}\u003c/button>`).join('')}\u003c/div>\n    \u003c/div>\n    ${isFallback ? '' : `\u003clabel>Loại\u003c/label>\n    \u003cdiv class=\"range two\" id=\"cKind\" style=\"margin:0\">\n      \u003cbutton type=\"button\" data-k=\"spend\" class=\"${c.kind !== 'save' ? 'on' : ''}\" onclick=\"setKind('spend')\">Chi tiêu\u003c/button>\n      \u003cbutton type=\"button\" data-k=\"save\" class=\"${c.kind === 'save' ? 'on' : ''}\" onclick=\"setKind('save')\">Để dành\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"muted\" id=\"cKindHint\" style=\"margin-top:4px\">\u003c/div>`}\n    \u003clabel for=\"cBudget\" id=\"cBudgetLabel\">Ngân sách mặc định mỗi tháng (đ)\u003c/label>\n    \u003cinput id=\"cBudget\" class=\"num\" inputmode=\"numeric\" value=\"${(c.defaultBudget != null ? c.defaultBudget : c.budget) ? (c.defaultBudget != null ? c.defaultBudget : c.budget).toLocaleString('vi-VN') : ''}\" onblur=\"fmtInput(this)\" placeholder=\"0\">\n    \u003cdiv class=\"muted\" style=\"margin-top:4px\">Áp dụng cho mọi tháng chưa chỉnh riêng, từ tháng này. Các tháng trước giữ nguyên.\u003c/div>\n    \u003clabel for=\"cKw\">Từ khóa nhận diện\u003c/label>\n    \u003ctextarea id=\"cKw\" style=\"min-height:64px\" placeholder=\"Cách nhau bằng dấu phẩy, ví dụ: gym, yoga, bơi\">${esc(c.keywords)}\u003c/textarea>\n    \u003cdiv class=\"muted\">Khi gõ \"gym 500k\", app tự xếp khoản đó vào danh mục này.\u003c/div>\n    ${!isNew && !isFallback ? `\u003cdiv id=\"delBox\">\u003c/div>` : ''}\n    ${isFallback ? '\u003cdiv class=\"notice\">\"Khác\" là danh mục dự phòng cho khoản chưa rõ loại, nên không đổi tên hay xóa được.\u003c/div>' : ''}\n    \u003cdiv class=\"row\" style=\"margin-top:14px\">\n      ${!isNew && !isFallback ? '\u003cbutton class=\"danger\" id=\"btnCatDel\" onclick=\"askDeleteCategory()\">Xóa\u003c/button>' : ''}\n      \u003cspan class=\"grow\">\u003c/span>\u003cbutton class=\"ghost\" onclick=\"closeModal()\">Hủy\u003c/button>\n      \u003cbutton class=\"primary\" id=\"btnCat\" onclick=\"saveCategoryForm()\">${isNew ? 'Thêm' : 'Lưu'}\u003c/button>\n    \u003c/div>`);\n  S.editingKind = c.kind || 'spend';\n  if (!isFallback) setKind(S.editingKind);\n  if (isNew) setTimeout(() => $('cName').focus(), 50);\n}\nfunction setKind(k) {\n  S.editingKind = k;\n  $('cKind').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === k));\n  $('cBudgetLabel').textContent = k === 'save' ? 'Mục tiêu để dành mặc định mỗi tháng (đ)' : 'Ngân sách mặc định mỗi tháng (đ)';\n  $('cKindHint').textContent = k === 'save'\n    ? 'Tiền chuyển vào tiết kiệm, đầu tư… Không tính vào tổng chi, theo dõi riêng so với mục tiêu.'\n    : 'Tính vào tổng chi và ngân sách chi tiêu.';\n}\n\nasync function saveCategoryForm() {\n  const c = S.editingCat;\n  const data = { oldName: c.name, name: $('cName').value, icon: $('cIcon').value, budget: digits($('cBudget').value), keywords: $('cKw').value,\n    kind: c.name === 'Khác' ? 'spend' : S.editingKind };\n  if (!data.name.trim()) { toast('Hãy nhập tên danh mục'); $('cName').focus(); return; }\n  const btn = $('btnCat'); busy(btn, true);\n  try {\n    const r = await api('saveCategory', data);\n    closeModal();\n    toast(r.created ? 'Đã thêm \"' + r.name + '\" ✓' : r.renamed ? 'Đã lưu, chuyển ' + r.renamed + ' khoản sang tên mới ✓' : 'Đã lưu ✓');\n    invalidate(); await refreshInit(); renderBudgets();\n  } catch (e) { fail(e); busy(btn, false); }\n}\n\nfunction askDeleteCategory() {\n  const c = S.editingCat;\n  const others = S.catList.filter(x => x.name !== c.name);\n  $('delBox').innerHTML = `\u003cdiv class=\"notice\">` + (c.count\n    ? `Danh mục này đang có \u003cb>${c.count} khoản chi\u003c/b>. Chuyển các khoản đó sang:\n       \u003cselect id=\"cMoveTo\" style=\"margin-top:8px\">${others.map(x => `\u003coption${x.name === 'Khác' ? ' selected' : ''} value=\"${esc(x.name)}\">${esc(x.icon)} ${esc(x.name)}\u003c/option>`).join('')}\u003c/select>`\n    : 'Danh mục này chưa có khoản chi nào.') +\n    `\u003cdiv class=\"row\" style=\"margin-top:10px\">\u003cspan class=\"grow\">\u003c/span>\u003cbutton class=\"danger\" id=\"btnCatDelOk\" onclick=\"confirmDeleteCategory()\">Xác nhận xóa \"${esc(c.name)}\"\u003c/button>\u003c/div>\u003c/div>`;\n  $('btnCatDel').classList.add('hidden');\n}\n\nasync function confirmDeleteCategory() {\n  const c = S.editingCat, moveTo = $('cMoveTo') ? $('cMoveTo').value : '';\n  const btn = $('btnCatDelOk'); busy(btn, true);\n  try {\n    const r = await api('deleteCategory', c.name, moveTo);\n    closeModal();\n    toast('Đã xóa \"' + r.deleted + '\"' + (r.moved ? ', chuyển ' + r.moved + ' khoản sang \"' + moveTo + '\"' : '') + ' ✓');\n    invalidate(); await refreshInit(); renderBudgets();\n  } catch (e) { fail(e); busy(btn, false); }\n}\n\n/* ---------------- Khởi động ---------------- */\n(async function start() {\n  try {\n    S.init = await api('getInitData');\n    S.init.categories.forEach(c => S.cats[c.name] = c);\n    S.dashMonth = S.init.today.slice(0, 7);\n    $('hMonth').value = S.dashMonth;\n    $('hCat').innerHTML = '\u003coption value=\"\">Mọi danh mục\u003c/option>' + catOptions('');\n    $('engine').textContent = S.init.aiName ? '🤖 ' + S.init.aiName : '⚙️ Offline';\n    $('engine').title = S.init.aiName ? 'Đang dùng ' + S.init.aiName + ' để hiểu câu nhập' : 'Chưa bật AI, dùng bộ tách offline';\n    renderQuick(null); loadRecent(); prefetch();\n    // Enter = Phân tích; Shift+Enter = xuống dòng\n    $('quick').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); doParse(); } });\n  } catch (e) {\n    document.querySelector('main').innerHTML = '\u003cdiv class=\"card\">\u003ch2>Chưa khởi tạo\u003c/h2>\u003cp>' + esc(e.message || e) +\n      '\u003c/p>\u003cp class=\"muted\">Mở Google Sheet → menu \u003cb>💰 Chi tiêu → Khởi tạo\u003c/b>, hoặc chạy hàm \u003ccode>setup\u003c/code> trong Apps Script.\u003c/p>\u003c/div>';\n  }\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";
const MANIFEST = "{\n  \"timeZone\": \"Asia/Ho_Chi_Minh\",\n  \"runtimeVersion\": \"V8\",\n  \"exceptionLogging\": \"STACKDRIVER\",\n  \"oauthScopes\": [\n    \"https://www.googleapis.com/auth/spreadsheets\",\n    \"https://www.googleapis.com/auth/script.external_request\",\n    \"https://www.googleapis.com/auth/script.container.ui\"\n  ],\n  \"webapp\": {\n    \"executeAs\": \"USER_DEPLOYING\",\n    \"access\": \"MYSELF\"\n  }\n}\n";

/* ---------- Điều khiển ---------- */
const KEY = 'so-chi-tieu-install-v1';
let st = { i: 0, done: {}, tests: {} };
try { st = Object.assign(st, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const $ = id => document.getElementById(id);

function render() {
  const s = STEPS[st.i], n = STEPS.length;
  $('bar').style.width = ((st.i + 1) / n * 100) + '%';
  $('count').textContent = 'Bước ' + st.i + ' / ' + (n - 1) + ' · ' + Object.keys(st.done).filter(k => st.done[k]).length + ' bước đã xong';
  $('step').innerHTML = '<div class="eyebrow">' + (st.i ? 'Bước ' + st.i + ' · ' : '') + s.phase + '</div><h2>' + s.title + '</h2>' + s.html() +
    (st.i && st.i < n - 1 ? '<label class="check' + (st.done[st.i] ? ' done' : '') + '"><input type="checkbox" id="doneBox"' + (st.done[st.i] ? ' checked' : '') +
      '><span><b>Tôi đã làm xong bước này</b></span></label>' : '');
  $('btnBack').disabled = st.i === 0;
  $('btnNext').textContent = st.i === 0 ? 'Bắt đầu →' : st.i === n - 1 ? 'Xong ✓' : 'Tiếp →';
  $('btnNext').disabled = st.i === n - 1;
  const box = $('doneBox');
  if (box) box.onchange = () => { st.done[st.i] = box.checked; save(); box.closest('.check').classList.toggle('done', box.checked); render(); };
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copy(b, CLIP[b.dataset.copy]));
  document.querySelectorAll('[data-test]').forEach(c => {
    c.checked = !!st.tests[c.dataset.test];
    c.onchange = () => { st.tests[c.dataset.test] = c.checked; save(); testResult(); };
  });
  testResult();
  window.scrollTo(0, 0);
}
function testResult() {
  const el = $('testResult'); if (!el) return;
  const n = Object.keys(st.tests).filter(k => st.tests[k]).length;
  el.innerHTML = n === 8 ? '✅ <b>Đạt cả 8/8.</b> App đã sẵn sàng dùng thật.' : 'Đã đạt ' + n + '/8.';
}
function go(i) { st.i = Math.max(0, Math.min(STEPS.length - 1, i)); save(); render(); }

function copy(btn, text) {
  const done = () => { const t = btn.textContent; btn.textContent = '✓ Đã copy'; btn.classList.add('ok'); setTimeout(() => { btn.textContent = t; btn.classList.remove('ok'); }, 1800); };
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    if (ok) done(); else { btn.textContent = 'Chọn & copy thủ công'; }
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}

$('btnBack').onclick = () => go(st.i - 1);
$('btnNext').onclick = () => go(st.i + 1);
$('btnToc').onclick = () => {
  $('tocList').innerHTML = STEPS.map((s, i) => '<button class="item' + (st.done[i] ? ' done' : '') + (i === st.i ? ' cur' : '') + '" data-i="' + i + '"><b>' +
    (st.done[i] ? '✓' : i) + '</b><span>' + s.title + '<small>' + s.phase + '</small></span></button>').join('');
  $('tocList').querySelectorAll('button').forEach(b => b.onclick = () => { $('toc').hidden = true; go(+b.dataset.i); });
  $('toc').hidden = false;
};
$('btnTocClose').onclick = () => { $('toc').hidden = true; };
$('toc').onclick = e => { if (e.target.id === 'toc') $('toc').hidden = true; };
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowRight') go(st.i + 1);
  if (e.key === 'ArrowLeft') go(st.i - 1);
});
render();
</script>

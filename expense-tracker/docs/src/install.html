<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cài đặt Sổ chi tiêu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Layout: mỗi màn 1 bước, thanh tiến độ trên cùng, nút Quay lại / Tiếp dính đáy; hình minh họa vẽ lại giao diện Google. */
  :root {
    --bg: #eef3f2; --card: #ffffff; --text: #15211f; --muted: #566769; --line: #dbe5e4;
    --brand: #0f766e; --brand-soft: #e3f3f0; --on-brand: #ffffff; --accent: #f59e0b; --accent-soft: #fef3c7;
    --warn: #b45309; --code-bg: #f4f7f7; --g-blue: #1a73e8;
    --font: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1211; --card: #152120; --text: #e4eeec; --muted: #93a6a3; --line: #263533;
      --brand: #2dd4bf; --brand-soft: #123a36; --on-brand: #062a27; --accent-soft: #3a2a07;
      --warn: #fbbf24; --code-bg: #0f1918; --g-blue: #8ab4f8; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1211; --card: #152120; --text: #e4eeec; --muted: #93a6a3; --line: #263533;
    --brand: #2dd4bf; --brand-soft: #123a36; --on-brand: #062a27; --accent-soft: #3a2a07;
    --warn: #fbbf24; --code-bg: #0f1918; --g-blue: #8ab4f8; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 var(--font); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 120px; }
  .top { display: flex; align-items: center; gap: 12px; }
  .top h1 { font-size: 18px; margin: 0; flex: 1; }
  .top a { color: var(--brand); font-size: 14px; }
  .progress { height: 6px; background: var(--line); border-radius: 3px; margin: 12px 0 6px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--brand); border-radius: 3px; transition: width .3s; }
  .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .meta button { background: none; border: 0; color: var(--brand); font: inherit; font-weight: 600; cursor: pointer; padding: 6px 0; min-height: 36px; }

  .step { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px; margin-top: 14px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--brand); }
  .step h2 { font-size: 24px; line-height: 1.3; margin: 4px 0 6px; text-wrap: balance; }
  .lead { color: var(--muted); margin: 0 0 14px; }
  ol.todo { padding-left: 0; list-style: none; counter-reset: s; margin: 14px 0; display: grid; gap: 10px; }
  ol.todo > li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
  ol.todo > li::before { content: counter(s); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
    background: var(--brand-soft); color: var(--brand); font-weight: 700; font-size: 14px; margin-top: 1px; }
  .ui { font-weight: 600; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
  .en { color: var(--muted); font-size: .9em; }
  code, .mono { font-family: var(--mono); font-size: .9em; background: var(--code-bg); border-radius: 5px; padding: 1px 5px; }
  .callout { border-radius: 12px; padding: 12px 14px; margin: 14px 0; font-size: 15px; display: grid; grid-template-columns: 24px 1fr; gap: 8px; }
  .callout.tip { background: var(--brand-soft); }
  .callout.warn { background: var(--accent-soft); }
  .callout b:first-child { font-size: 18px; line-height: 1.3; }
  a { color: var(--brand); }

  .copybox { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin: 12px 0; }
  .copybox header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--code-bg); }
  .copybox header span { flex: 1; min-width: 0; font-family: var(--mono); font-size: 14px; }
  .copybox header small { color: var(--muted); font-family: var(--font); }
  .copybox pre { margin: 0; padding: 12px; max-height: 180px; overflow: auto; font: 12px/1.5 var(--mono); background: var(--card); }
  .copybox textarea { position: absolute; left: -9999px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; font-weight: 600; min-height: 44px; padding: 8px 16px; }
  button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .btn-copy { background: var(--brand); color: var(--on-brand); min-height: 40px; padding: 6px 14px; }
  .btn-copy.ok { background: var(--brand-soft); color: var(--brand); }
  .kv { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 12px; align-items: center; margin: 12px 0; }
  .kv .k { font-family: var(--mono); font-weight: 600; }

  /* Hình minh họa giao diện Google (vẽ lại, đơn giản hóa) */
  .shot { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin: 14px 0; background: var(--card); font-size: 13px; }
  .shot .bar { display: flex; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--code-bg); flex-wrap: wrap; }
  .shot .bar .t { font-weight: 600; margin-right: 8px; }
  .shot .menu span { padding: 3px 7px; border-radius: 5px; }
  .shot .body { padding: 12px; position: relative; }
  .hl { outline: 2.5px solid var(--accent); outline-offset: 1px; border-radius: 6px; background: var(--accent-soft); }
  .mk { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #1b1300;
    font-size: 11px; font-weight: 700; margin-left: 4px; vertical-align: 1px; }
  .drop { position: relative; display: inline-block; margin: 6px 0 0 120px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 0; background: var(--card); box-shadow: 0 6px 18px rgba(0,0,0,.12); min-width: 170px; }
  .drop div { padding: 6px 12px; }
  .gbtn { display: inline-block; background: var(--g-blue); color: #fff; border-radius: 6px; padding: 3px 12px; font-weight: 600; }
  .side { display: grid; grid-template-columns: 150px 1fr; min-height: 120px; }
  .side .files { border-right: 1px solid var(--line); padding: 10px; }
  .side .files div { padding: 4px 6px; border-radius: 5px; }
  .side .ed { padding: 10px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .dialog { max-width: 360px; margin: 6px auto; border: 1px solid var(--line); border-radius: 10px; padding: 14px; box-shadow: 0 8px 22px rgba(0,0,0,.12); }
  .dialog h4 { margin: 0 0 6px; font-size: 15px; }
  .dialog .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .dialog .row:last-of-type { border-bottom: 0; }
  .phoneshot { display: flex; gap: 12px; flex-wrap: wrap; }
  .phoneshot > div { flex: 1; min-width: 200px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }

  .check { display: flex; gap: 12px; align-items: center; margin-top: 18px; padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--line); cursor: pointer; }
  .check input { width: 22px; height: 22px; accent-color: var(--brand); flex: none; }
  .check.done { border-style: solid; border-color: var(--brand); background: var(--brand-soft); }
  .tests { display: grid; gap: 8px; margin: 12px 0; }
  .tests label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  .tests input { width: 20px; height: 20px; accent-color: var(--brand); margin-top: 3px; flex: none; }
  .tests small { display: block; color: var(--muted); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  .tablewrap { overflow-x: auto; margin: 12px 0; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  details { border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; margin: 10px 0; }
  details summary { cursor: pointer; font-weight: 600; padding: 12px 0; min-height: 44px; }
  details[open] summary { border-bottom: 1px solid var(--line); margin-bottom: 8px; }

  .nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); z-index: 5;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .nav .in { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
  .nav .back { background: var(--brand-soft); color: var(--brand); }
  .nav .next { background: var(--brand); color: var(--on-brand); flex: 1; }
  .nav button:disabled { opacity: .4; cursor: default; }

  .toc { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; display: flex; justify-content: center; align-items: flex-end; }
  .toc .sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 85vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  @media (min-width: 640px) { .toc { align-items: center; } .toc .sheet { border-radius: 18px; } }
  .toc button.item { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: transparent; color: var(--text); font-weight: 500; border-radius: 10px; }
  .toc button.item:hover { background: var(--bg); }
  .toc button.item b { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--bg); font-size: 13px; flex: none; }
  .toc button.item.done b { background: var(--brand); color: var(--on-brand); }
  .toc button.item.cur { background: var(--brand-soft); }
  .toc small { color: var(--muted); display: block; font-size: 12px; }
  [hidden] { display: none !important; }
  @media (max-width: 560px) { .step { padding: 18px 16px; } .step h2 { font-size: 21px; } .side { grid-template-columns: 110px 1fr; } .drop { margin-left: 40px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Cài đặt Sổ chi tiêu</h1>
    <a href="index.html">Bộ tài liệu</a>
  </div>
  <div class="progress"><i id="bar"></i></div>
  <div class="meta"><span id="count"></span><button id="btnToc">☰ Mục lục</button></div>
  <article class="step" id="step" aria-live="polite"></article>
</div>
<nav class="nav"><div class="in">
  <button class="back" id="btnBack">← Quay lại</button>
  <button class="next" id="btnNext">Tiếp →</button>
</div></nav>
<div class="toc" id="toc" hidden><div class="sheet">
  <div style="display:flex;align-items:center"><h2 style="margin:0;flex:1;font-size:18px">Mục lục</h2><button id="btnTocClose" style="background:var(--bg);color:var(--text)">Đóng</button></div>
  <div id="tocList" style="margin-top:10px;display:grid;gap:4px"></div>
</div></div>

<script>
const CODE_GS = /*__CODE_GS__*/'';
const INDEX_HTML = /*__INDEX_HTML__*/'';
const MANIFEST = /*__MANIFEST__*/'';

const ui = (vi, en) => '<span class="ui">' + vi + '</span>' + (en ? ' <span class="en">(' + en + ')</span>' : '');
const mk = n => '<span class="mk">' + n + '</span>';
const tip = h => '<div class="callout tip"><b>💡</b><div>' + h + '</div></div>';
const warn = h => '<div class="callout warn"><b>⚠️</b><div>' + h + '</div></div>';
const lines = s => s.split('\n').length;
const copyBox = (id, name, content, note) => '<div class="copybox"><header><span>' + name + ' <small>· ' + lines(content).toLocaleString('vi-VN') +
  ' dòng' + (note ? ' · ' + note : '') + '</small></span><button class="btn-copy" data-copy="' + id + '">Copy</button></header>' +
  '<pre>' + esc(content.split('\n').slice(0, 12).join('\n')) + '\n…</pre></div>';
const copyText = (id, text) => '<button class="btn-copy" data-copy="' + id + '">Copy</button>';
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

const CLIP = {
  code: CODE_GS, index: INDEX_HTML, manifest: MANIFEST,
  name: 'Sổ chi tiêu', fnname: 'Index', key: 'GEMINI_API_KEY', ver: 'v1.0',
  report: 'BÁO CÁO 2 TUẦN DÙNG SỔ CHI TIÊU\n- Số ngày có ghi / 14: \n- Thời gian ghi 1 khoản (ước lượng): \n- Cách ghi dùng nhiều nhất (câu tự nhiên / ghi lại nhanh / nhập tay): \n- Số lần mở Tổng quan mỗi tuần: \n- Chi tiêu thực tế so với ngân sách tháng: \n- Lỗi gặp phải (nguyên văn nếu có): \n- Điều thích nhất: \n- Điều phiền nhất: \n- Tính năng muốn có tiếp: '
};

/* ---------- Nội dung các bước ---------- */
const STEPS = [
{ phase: 'Bắt đầu', title: 'Chuẩn bị trước khi cài', html: () => `
  <p class="lead">Khoảng 30 phút. Làm trên máy tính cho các bước 1–9 (dễ copy, dán), điện thoại dùng từ bước 10.</p>
  <div class="tablewrap"><table>
    <tr><th>Cần có</th><th>Ghi chú</th></tr>
    <tr><td>Tài khoản Google (Gmail)</td><td>Dữ liệu nằm trong Google Drive của bạn</td></tr>
    <tr><td>Máy tính có Chrome</td><td>Để dán code vào Apps Script</td></tr>
    <tr><td>Điện thoại</td><td>Để dùng app hằng ngày</td></tr>
  </table></div>
  <div class="tablewrap"><table>
    <tr><th>Giai đoạn</th><th>Bước</th><th>Thời gian</th></tr>
    <tr><td>Tạo Google Sheet & dán code</td><td>1–5</td><td>~10 phút</td></tr>
    <tr><td>Khởi tạo & cấp quyền</td><td>6–8</td><td>~5 phút</td></tr>
    <tr><td>Deploy & mở trên điện thoại</td><td>9–10</td><td>~5 phút</td></tr>
    <tr><td>Bật AI Gemini (miễn phí)</td><td>11</td><td>~5 phút</td></tr>
    <tr><td>Kiểm tra & bắt đầu dùng thật</td><td>12–13</td><td>~5 phút</td></tr>
  </table></div>
  ${tip('Code của app đã nằm sẵn trong hướng dẫn này. Đến bước cần dán, chỉ việc bấm <b>Copy</b>.')}
  ${tip('Giao diện Google trong hướng dẫn là <b>hình vẽ lại, đơn giản hóa</b>. Tên nút ghi cả tiếng Việt và tiếng Anh vì tùy cài đặt ngôn ngữ của tài khoản Google, có thể hơi khác vị trí.')}` },

{ phase: 'Google Sheet', title: 'Tạo Google Sheet mới', html: () => `
  <ol class="todo">
    <li><div>Mở <a href="https://sheets.new" target="_blank" rel="noopener">sheets.new</a> (tạo ngay một bảng tính trống).</div></li>
    <li><div>Bấm vào tên <b>"Bảng tính không có tiêu đề"</b> ở góc trên trái, đổi thành <span class="ui">Sổ chi tiêu</span> ${copyText('name')}</div></li>
  </ol>
  <div class="shot"><div class="bar"><span class="t hl">Sổ chi tiêu ${mk(2)}</span></div>
    <div class="body" style="color:var(--muted)">A &nbsp;&nbsp; B &nbsp;&nbsp; C &nbsp;&nbsp; D … (bảng trống)</div></div>
  ${tip('Đây là nơi lưu toàn bộ dữ liệu. Bạn có thể mở xem, lọc, xuất Excel bất cứ lúc nào.')}` },

{ phase: 'Apps Script', title: 'Mở Apps Script', html: () => `
  <ol class="todo">
    <li><div>Trên thanh menu của Google Sheet, bấm ${ui('Tiện ích mở rộng', 'Extensions')}.</div></li>
    <li><div>Chọn ${ui('Apps Script')}. Một tab mới mở ra: đây là nơi chứa code của app.</div></li>
    <li><div>Bấm vào tên dự án <b>"Dự án không có tiêu đề"</b> ở góc trên trái, đổi thành <span class="ui">Sổ chi tiêu</span>.</div></li>
  </ol>
  <div class="shot"><div class="bar menu"><span class="t">Sổ chi tiêu</span><span>Tệp</span><span>Chỉnh sửa</span><span>Xem</span><span>Chèn</span><span>Định dạng</span><span>Dữ liệu</span><span>Công cụ</span><span class="hl">Tiện ích mở rộng${mk(1)}</span><span>Trợ giúp</span></div>
    <div class="body"><div class="drop"><div>Tiện ích bổ sung ›</div><div>Macro ›</div><div class="hl">Apps Script ${mk(2)}</div></div></div></div>` },

{ phase: 'Apps Script', title: 'Dán code chính (Code.gs)', html: () => `
  <ol class="todo">
    <li><div>Bấm <b>Copy</b> ở khung dưới.</div></li>
    <li><div>Trong Apps Script, file <span class="mono">Code.gs</span> đang mở sẵn với vài dòng mẫu (<span class="mono">function myFunction()…</span>). Bấm vào vùng code, nhấn <span class="ui">Ctrl + A</span> (Mac: <span class="ui">⌘ + A</span>) rồi <span class="ui">Ctrl + V</span> để thay toàn bộ.</div></li>
    <li><div>Nhấn <span class="ui">Ctrl + S</span> hoặc biểu tượng 💾 để lưu.</div></li>
  </ol>
  ${copyBox('code', 'Code.gs', CODE_GS, 'phần xử lý dữ liệu, ngân sách, AI')}
  <div class="shot"><div class="bar"><span class="t">Sổ chi tiêu</span><span style="flex:1"></span><span>💾 ${mk(3)}</span><span>▶ Chạy</span><span class="gbtn">Triển khai</span></div>
    <div class="side"><div class="files"><b>Tệp</b> +<div class="hl">Code.gs</div></div><div class="ed">/** Sổ chi tiêu cá nhân …<br>const SHEET_TX = 'GiaoDich';<br>…</div></div></div>
  ${warn('Phải <b>thay toàn bộ</b> nội dung cũ. Nếu còn sót <span class="mono">function myFunction()</span> ở đầu cũng không sao, nhưng tốt nhất là xóa sạch.')}` },

{ phase: 'Apps Script', title: 'Tạo file giao diện (Index)', html: () => `
  <ol class="todo">
    <li><div>Bấm dấu ${ui('+', 'Add a file')} cạnh chữ <b>Tệp</b> <span class="en">(Files)</span> → chọn ${ui('HTML')}.</div></li>
    <li><div>Đặt tên đúng là <span class="ui">Index</span> ${copyText('fnname')} rồi nhấn Enter. <b>Không gõ</b> ".html", Apps Script tự thêm.</div></li>
    <li><div>Xóa hết nội dung mẫu trong file mới, bấm <b>Copy</b> bên dưới rồi dán vào. Lưu (<span class="ui">Ctrl + S</span>).</div></li>
  </ol>
  ${copyBox('index', 'Index.html', INDEX_HTML, 'giao diện app')}
  <div class="shot"><div class="side"><div class="files"><b>Tệp</b> <span class="hl">+${mk(1)}</span><div>Code.gs</div><div class="hl">Index.html ${mk(2)}</div></div>
    <div class="ed">&lt;!DOCTYPE html&gt;<br>&lt;html lang="vi"&gt;<br>…</div></div></div>
  ${warn('Tên phải là <b>Index</b>, chữ I viết hoa. Sai tên thì app báo lỗi không tìm thấy giao diện.')}` },

{ phase: 'Apps Script', title: 'Cài đặt múi giờ & quyền truy cập', html: () => `
  <p class="lead">File cấu hình đặt múi giờ Việt Nam và giới hạn để <b>chỉ mình bạn</b> mở được app.</p>
  <ol class="todo">
    <li><div>Ở thanh bên trái, bấm biểu tượng ⚙️ ${ui('Cài đặt dự án', 'Project Settings')}.</div></li>
    <li><div>Tích vào ô ${ui('Hiển thị tệp kê khai "appsscript.json" trong trình chỉnh sửa', 'Show "appsscript.json" manifest file in editor')}.</div></li>
    <li><div>Quay lại biểu tượng <b>&lt;&gt;</b> ${ui('Trình chỉnh sửa', 'Editor')}, mở file <span class="mono">appsscript.json</span> vừa xuất hiện.</div></li>
    <li><div>Chọn hết (<span class="ui">Ctrl + A</span>), bấm <b>Copy</b> bên dưới rồi dán đè. Lưu lại.</div></li>
  </ol>
  ${copyBox('manifest', 'appsscript.json', MANIFEST, 'múi giờ + quyền')}
  ${tip('Bước này không bắt buộc nhưng nên làm. Nếu bỏ qua, nhớ chọn đúng <b>"Chỉ mình tôi"</b> ở bước Deploy.')}` },

/* ---------- Điều khiển ---------- */
const KEY = 'so-chi-tieu-install-v1';
let st = { i: 0, done: {}, tests: {} };
try { st = Object.assign(st, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const $ = id => document.getElementById(id);

function render() {
  const s = STEPS[st.i], n = STEPS.length;
  $('bar').style.width = ((st.i + 1) / n * 100) + '%';
  $('count').textContent = 'Bước ' + st.i + ' / ' + (n - 1) + ' · ' + Object.keys(st.done).filter(k => st.done[k]).length + ' bước đã xong';
  $('step').innerHTML = '<div class="eyebrow">' + (st.i ? 'Bước ' + st.i + ' · ' : '') + s.phase + '</div><h2>' + s.title + '</h2>' + s.html() +
    (st.i && st.i < n - 1 ? '<label class="check' + (st.done[st.i] ? ' done' : '') + '"><input type="checkbox" id="doneBox"' + (st.done[st.i] ? ' checked' : '') +
      '><span><b>Tôi đã làm xong bước này</b></span></label>' : '');
  $('btnBack').disabled = st.i === 0;
  $('btnNext').textContent = st.i === 0 ? 'Bắt đầu →' : st.i === n - 1 ? 'Xong ✓' : 'Tiếp →';
  $('btnNext').disabled = st.i === n - 1;
  const box = $('doneBox');
  if (box) box.onchange = () => { st.done[st.i] = box.checked; save(); box.closest('.check').classList.toggle('done', box.checked); render(); };
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copy(b, CLIP[b.dataset.copy]));
  document.querySelectorAll('[data-test]').forEach(c => {
    c.checked = !!st.tests[c.dataset.test];
    c.onchange = () => { st.tests[c.dataset.test] = c.checked; save(); testResult(); };
  });
  testResult();
  window.scrollTo(0, 0);
}
function testResult() {
  const el = $('testResult'); if (!el) return;
  const n = Object.keys(st.tests).filter(k => st.tests[k]).length;
  el.innerHTML = n === 8 ? '✅ <b>Đạt cả 8/8.</b> App đã sẵn sàng dùng thật.' : 'Đã đạt ' + n + '/8.';
}
function go(i) { st.i = Math.max(0, Math.min(STEPS.length - 1, i)); save(); render(); }

function copy(btn, text) {
  const done = () => { const t = btn.textContent; btn.textContent = '✓ Đã copy'; btn.classList.add('ok'); setTimeout(() => { btn.textContent = t; btn.classList.remove('ok'); }, 1800); };
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    if (ok) done(); else { btn.textContent = 'Chọn & copy thủ công'; }
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}

$('btnBack').onclick = () => go(st.i - 1);
$('btnNext').onclick = () => go(st.i + 1);
$('btnToc').onclick = () => {
  $('tocList').innerHTML = STEPS.map((s, i) => '<button class="item' + (st.done[i] ? ' done' : '') + (i === st.i ? ' cur' : '') + '" data-i="' + i + '"><b>' +
    (st.done[i] ? '✓' : i) + '</b><span>' + s.title + '<small>' + s.phase + '</small></span></button>').join('');
  $('tocList').querySelectorAll('button').forEach(b => b.onclick = () => { $('toc').hidden = true; go(+b.dataset.i); });
  $('toc').hidden = false;
};
$('btnTocClose').onclick = () => { $('toc').hidden = true; };
$('toc').onclick = e => { if (e.target.id === 'toc') $('toc').hidden = true; };
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowRight') go(st.i + 1);
  if (e.key === 'ArrowLeft') go(st.i - 1);
});
render();
</script>
</body>
</html>

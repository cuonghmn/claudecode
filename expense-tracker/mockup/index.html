<title>Sổ chi tiêu cá nhân</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
  /* Layout: app 1 cột cho điện thoại, thanh tab cố định đáy; thẻ trắng trên nền xám ngả xanh ngọc. */

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1615; --card: #16211f; --text: #e4eeec; --muted: #8fa3a0; --line: #263533;

      --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --shadow: none; color-scheme: dark;

  :root[data-theme="dark"] {
    --bg: #0e1615; --card: #16211f; --text: #e4eeec; --muted: #8fa3a0; --line: #263533;

  @media (min-width: 620px) { .modal { align-items: center; } .modal .sheet { border-radius: 18px; } }
  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--text); color: var(--bg);

<script>
/* ===== Giả lập Google Apps Script trong trình duyệt ===== */
const MOCK_KEY = 'so-chi-tieu-mockup-v1';
const Backend = (function () {
  function Sheet(d) { this.d = d || []; }
  Sheet.prototype.getLastRow = function () { return this.d.length; };
  Sheet.prototype.getRange = function (r, c, nr, nc) {
    const sh = this;
    if (typeof r === 'string') {
      return {
        createTextFinder: v => ({ matchEntireCell: () => ({ findNext: () => {
          const i = sh.d.findIndex(x => String(x[0]) === v); return i < 0 ? null : { getRow: () => i + 1 }; } }) }),
        setNumberFormat() { return this; }
      };
    }
    nr = nr || 1; nc = nc || 1;
    const R = {
      getValues: () => { const o = []; for (let i = 0; i < nr; i++) { const row = sh.d[r - 1 + i] || [];
        o.push(Array.from({ length: nc }, (_, j) => row[c - 1 + j] === undefined ? '' : row[c - 1 + j])); } return o; },
      setValues: v => { v.forEach((row, i) => { sh.d[r - 1 + i] = sh.d[r - 1 + i] || [];
        row.forEach((x, j) => { sh.d[r - 1 + i][c - 1 + j] = x; }); }); persist(); return R; },
      clearContent: () => { for (let i = 0; i < nr; i++) sh.d[r - 1 + i] = [];
        while (sh.d.length && !sh.d[sh.d.length - 1].length) sh.d.pop(); persist(); return R; },
      setFontWeight: () => R, setBackground: () => R, setFontColor: () => R, setNumberFormat: () => R
    };
    return R;
  };
  Sheet.prototype.deleteRow = function (r) { this.d.splice(r - 1, 1); persist(); };
  Sheet.prototype.setFrozenRows = Sheet.prototype.setColumnWidth = function () {};

  let sheets = {};
  const ss = { getId: () => 'mock', getUrl: () => '', getSheetByName: n => sheets[n] || null,
    insertSheet: n => (sheets[n] = new Sheet()), getSheets: () => Object.values(sheets), deleteSheet() {} };
  function persist() {
    try {
      const raw = {}; Object.keys(sheets).forEach(k => { raw[k] = sheets[k].d; });
      localStorage.setItem(MOCK_KEY, JSON.stringify(raw, (k, v) => v));
    } catch (e) { /* trình duyệt chặn lưu: mockup vẫn chạy, chỉ không nhớ sau khi tải lại */ }
  }
  function restore() {
    try {
      const raw = JSON.parse(localStorage.getItem(MOCK_KEY) || 'null');
      if (!raw) return false;
      const iso = /^\d{4}-\d{2}-\d{2}T/;
      Object.keys(raw).forEach(k => { sheets[k] = new Sheet(raw[k].map(r => r.map(v => typeof v === 'string' && iso.test(v) ? new Date(v) : v))); });
      return true;
    } catch (e) { return false; }
  }
  const pad = n => String(n).padStart(2, '0');
  const SpreadsheetApp = { getActiveSpreadsheet: () => ss, openById: () => ss };
  const PropertiesService = { getScriptProperties: () => ({ getProperty: () => null, setProperty() {} }) };
  const Session = { getScriptTimeZone: () => 'Asia/Ho_Chi_Minh' };
  const LockService = { getScriptLock: () => ({ waitLock() {}, releaseLock() {} }) };
  const Utilities = {
    getUuid: () => Math.random().toString(16).slice(2, 10) + Date.now().toString(16),
    formatDate: d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
  };

  /* ---- Code.gs (nguyên bản) ---- */
/**
 * Sổ chi tiêu cá nhân — Google Sheets + Apps Script + AI (Gemini free hoặc Claude)
 *
 * Sheet "GiaoDich": mỗi dòng là 1 khoản chi.
 * Sheet "DanhMuc":  danh mục, icon, ngân sách tháng, từ khóa nhận diện (sửa trực tiếp trên Sheet được).
 *
 * Script Properties (Project Settings → Script properties):
 *   AI_PROVIDER        gemini | claude | off. Bỏ trống: tự chọn theo key đang có (ưu tiên Gemini).
 *   GEMINI_API_KEY     key miễn phí từ Google AI Studio (aistudio.google.com → Get API key).
 *   GEMINI_MODEL       (tùy chọn) mặc định gemini-flash-latest.
 *   ANTHROPIC_API_KEY  key Claude (platform.claude.com) — khi chuyển sang Claude.
 *   CLAUDE_MODEL       (tùy chọn) mặc định claude-opus-5-5.
 * Không có key nào thì app dùng bộ tách quy tắc (offline) — vẫn chạy bình thường.
 */

const SHEET_TX = 'GiaoDich';
const SHEET_CAT = 'DanhMuc';
const TX_HEADERS = ['ID', 'Ngày', 'Số tiền', 'Danh mục', 'Mô tả', 'Phương thức', 'Ghi chú', 'Tạo lúc'];
const CAT_HEADERS = ['Danh mục', 'Icon', 'Ngân sách tháng', 'Từ khóa (cách nhau bởi dấu phẩy)'];
const METHODS = ['Chuyển khoản', 'Thẻ', 'Tiền mặt', 'Ví điện tử'];
const DEFAULT_METHOD = 'Chuyển khoản';
const DEFAULT_GEMINI_MODEL = 'gemini-flash-latest';
const DEFAULT_CLAUDE_MODEL = 'claude-opus-5-5';
// Các model hỗ trợ fallbacks "default" (tự chuyển model khi bị bộ lọc an toàn từ chối nhầm).
// Khoản >= ngưỡng này coi là khoản lớn/cố định (tiền nhà, tiết kiệm…): không ngoại suy khi dự báo cuối tháng.
const BIG_ITEM_THRESHOLD = 1000000;
const FALLBACK_MODELS = ['claude-opus-5-5', 'claude-opus-5', 'claude-fable-5-1', 'claude-sonnet-5-5'];

const DEFAULT_CATEGORIES = [
  ['Ăn uống', '🍜', 4000000, 'ăn,phở,bún,cơm,mì,bánh mì,trưa,tối,sáng,cafe,cà phê,coffee,trà sữa,trà,nước,nhậu,bia,lẩu,nướng,highland,starbucks,phúc long,grabfood,shopeefood,đi chợ,siêu thị,winmart,bách hóa xanh,trái cây'],
  ['Đi lại', '🛵', 1000000, 'grab,be,xanh sm,taxi,xăng,gửi xe,vé xe,xe buýt,bus,metro,máy bay,vé máy bay,rửa xe,sửa xe,thay nhớt,cầu đường'],
  ['Nhà ở & Hóa đơn', '🏠', 6000000, 'tiền nhà,thuê nhà,điện,tiền điện,tiền nước,internet,wifi,cước,điện thoại,4g,gas,phí quản lý,chung cư'],
  ['Mua sắm', '🛍️', 2000000, 'mua,quần,áo,giày,dép,túi,shopee,lazada,tiki,tiktok shop,đồ dùng,mỹ phẩm,cắt tóc'],
  ['Sức khỏe', '💊', 500000, 'thuốc,khám,bệnh viện,phòng khám,nha khoa,gym,yoga,bảo hiểm,vitamin'],
  ['Học tập', '📚', 500000, 'sách,khóa học,course,học phí,udemy,coursera,học'],
  ['Giải trí', '🎬', 800000, 'phim,xem phim,cgv,netflix,spotify,youtube,game,karaoke,du lịch,khách sạn,vé xem'],
  ['Gia đình & Hiếu hỉ', '🎁', 1000000, 'biếu,mừng,đám cưới,cưới,đám,sinh nhật,quà,gửi mẹ,gửi bố,gia đình,lì xì'],
  ['Tiết kiệm & Đầu tư', '💰', 3000000, 'tiết kiệm,gửi tiết kiệm,đầu tư,chứng khoán,cổ phiếu,vàng,quỹ,ccq'],
  ['Khác', '📌', 500000, '']
];

/* ============================ Web app & menu ============================ */

function doGet() {
  return HtmlService.createHtmlOutputFromFile('Index')
    .setTitle('Sổ chi tiêu')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover');
}

function onOpen() {
  SpreadsheetApp.getUi()
    .createMenu('💰 Chi tiêu')
    .addItem('1. Khởi tạo / sửa cấu trúc Sheet', 'setup')
    .addSeparator()
    .addItem('Thêm dữ liệu DEMO (2 tháng)', 'seedDemoData')
    .addItem('Xóa dữ liệu DEMO', 'removeDemoData')
    .addToUi();
}

/** Chạy 1 lần: tạo 2 sheet, tiêu đề, danh mục mặc định, lưu ID file. An toàn khi chạy lại. */
function setup() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  if (!ss) throw new Error('Hãy mở Apps Script từ Google Sheet (Tiện ích mở rộng → Apps Script) rồi chạy setup.');
  PropertiesService.getScriptProperties().setProperty('SPREADSHEET_ID', ss.getId());

  let tx = ss.getSheetByName(SHEET_TX);
  if (!tx) tx = ss.insertSheet(SHEET_TX);
  tx.getRange(1, 1, 1, TX_HEADERS.length).setValues([TX_HEADERS])
    .setFontWeight('bold').setBackground('#0f766e').setFontColor('#ffffff');
  tx.setFrozenRows(1);
  tx.getRange('B:B').setNumberFormat('dd/MM/yyyy');
  tx.getRange('C:C').setNumberFormat('#,##0');
  tx.getRange('H:H').setNumberFormat('dd/MM/yyyy HH:mm');
  tx.setColumnWidth(1, 110); tx.setColumnWidth(5, 260);

  let cat = ss.getSheetByName(SHEET_CAT);
  if (!cat) {
    cat = ss.insertSheet(SHEET_CAT);
    cat.getRange(2, 1, DEFAULT_CATEGORIES.length, 4).setValues(DEFAULT_CATEGORIES);
  }
  cat.getRange(1, 1, 1, CAT_HEADERS.length).setValues([CAT_HEADERS])
    .setFontWeight('bold').setBackground('#0f766e').setFontColor('#ffffff');
  cat.setFrozenRows(1);
  cat.getRange('C:C').setNumberFormat('#,##0');
  cat.setColumnWidth(4, 480);

  const sheet1 = ss.getSheetByName('Sheet1') || ss.getSheetByName('Trang tính1');
  if (sheet1 && sheet1.getLastRow() === 0 && ss.getSheets().length > 2) ss.deleteSheet(sheet1);
  return 'OK';
}

/* ============================ Helpers ============================ */

function ss_() {
  const id = PropertiesService.getScriptProperties().getProperty('SPREADSHEET_ID');
  if (id) return SpreadsheetApp.openById(id);
  const active = SpreadsheetApp.getActiveSpreadsheet();
  if (!active) throw new Error('Chưa khởi tạo. Mở Apps Script và chạy hàm setup trước.');
  return active;
}

function sheet_(name) {
  const sh = ss_().getSheetByName(name);
  if (!sh) throw new Error('Không tìm thấy sheet "' + name + '". Hãy chạy setup.');
  return sh;
}

function tz_() { return Session.getScriptTimeZone() || 'Asia/Ho_Chi_Minh'; }
function todayStr_() { return Utilities.formatDate(new Date(), tz_(), 'yyyy-MM-dd'); }
function prop_(k) { return PropertiesService.getScriptProperties().getProperty(k); }

function fmtDate_(v) {
  if (v instanceof Date) return Utilities.formatDate(v, tz_(), 'yyyy-MM-dd');
  return String(v || '').slice(0, 10);
}

function toDate_(ymd) {
  const p = String(ymd).split('-').map(Number);
  return new Date(p[0], p[1] - 1, p[2]);
}

/** Cộng ngày trên chuỗi yyyy-MM-dd (thuần, không phụ thuộc múi giờ). */
function addDays_(ymd, n) {
  const p = ymd.split('-').map(Number);
  const d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
  return d.toISOString().slice(0, 10);
}

function prevMonth_(ym) {
  const p = ym.split('-').map(Number);
  const d = new Date(Date.UTC(p[0], p[1] - 2, 1));
  return d.toISOString().slice(0, 7);
}

function daysInMonth_(ym) {
  const p = ym.split('-').map(Number);
  return new Date(Date.UTC(p[0], p[1], 0)).getUTCDate();
}

function withLock_(fn) {
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try { return fn(); } finally { lock.releaseLock(); }
}

/* ============================ Đọc dữ liệu ============================ */

function getCategories_() {
  const sh = sheet_(SHEET_CAT);
  const n = sh.getLastRow() - 1;
  if (n < 1) return [];
  return sh.getRange(2, 1, n, 4).getValues()
    .filter(r => String(r[0]).trim())
    .map(r => ({
      name: String(r[0]).trim(),
      icon: String(r[1] || '•'),
      budget: Number(r[2]) || 0,
      keywords: String(r[3] || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean)
    }));
}

function readTx_() {
  const sh = sheet_(SHEET_TX);
  const n = sh.getLastRow() - 1;
  if (n < 1) return [];
  return sh.getRange(2, 1, n, TX_HEADERS.length).getValues()
    .filter(r => r[0])
    .map(r => ({
      id: String(r[0]),
      date: fmtDate_(r[1]),
      amount: Number(r[2]) || 0,
      category: String(r[3] || 'Khác'),
      description: String(r[4] || ''),
      method: String(r[5] || ''),
      note: String(r[6] || ''),
      createdAt: r[7] instanceof Date ? r[7].getTime() : 0
    }));
}

function sortTx_(list) {
  return list.sort((a, b) => (b.date > a.date ? 1 : b.date < a.date ? -1 : b.createdAt - a.createdAt));
}

/* ============================ API cho giao diện ============================ */

function getInitData() {
  const cats = getCategories_();
  return {
    categories: cats.map(c => ({ name: c.name, icon: c.icon, budget: c.budget })),
    methods: METHODS,
    defaultMethod: DEFAULT_METHOD,
    today: todayStr_(),
    aiName: aiName_(),
    sheetUrl: ss_().getUrl()
  };
}

function getTransactions(month, category, query) {
  const q = String(query || '').trim().toLowerCase();
  const list = readTx_().filter(t =>
    (!month || t.date.slice(0, 7) === month) &&
    (!category || t.category === category) &&
    (!q || (t.description + ' ' + t.note + ' ' + t.category).toLowerCase().indexOf(q) >= 0));
  return sortTx_(list);
}

function getRecent(limit) {
  const all = sortTx_(readTx_());
  const today = todayStr_();
  return {
    todayTotal: all.filter(t => t.date === today).reduce((s, t) => s + t.amount, 0),
    items: all.slice(0, limit || 6)
  };
}

function getDashboard(month) {
  const cats = getCategories_();
  const all = readTx_();
  const prev = prevMonth_(month);
  const cur = all.filter(t => t.date.slice(0, 7) === month);
  const prevTx = all.filter(t => t.date.slice(0, 7) === prev);
  const total = cur.reduce((s, t) => s + t.amount, 0);
  const prevTotal = prevTx.reduce((s, t) => s + t.amount, 0);
  const budget = cats.reduce((s, c) => s + c.budget, 0);

  const today = todayStr_();
  const days = daysInMonth_(month);
  const elapsed = month === today.slice(0, 7) ? Number(today.slice(8, 10)) : (month < today.slice(0, 7) ? days : 0);

  const byCatMap = {};
  cats.forEach(c => { byCatMap[c.name] = { name: c.name, icon: c.icon, budget: c.budget, amount: 0, prev: 0, count: 0 }; });
  const ensure = name => byCatMap[name] || (byCatMap[name] = { name: name, icon: '•', budget: 0, amount: 0, prev: 0, count: 0 });
  cur.forEach(t => { const c = ensure(t.category); c.amount += t.amount; c.count++; });
  prevTx.forEach(t => { ensure(t.category).prev += t.amount; });

  // So cùng kỳ: ngày 1..N tháng này với ngày 1..N tháng trước (N = số ngày đã qua).
  const prevSamePeriod = prevTx.filter(t => Number(t.date.slice(8, 10)) <= elapsed).reduce((s, t) => s + t.amount, 0);

  // Dự báo = đã chi + (chi thường ngày TB × số ngày còn lại). Khoản lớn không bị nhân lên.
  const routine = cur.filter(t => t.amount < BIG_ITEM_THRESHOLD).reduce((s, t) => s + t.amount, 0);
  const avgRoutine = elapsed ? routine / elapsed : 0;

  const daily = [];
  for (let d = 1; d <= days; d++) daily.push(0);
  cur.forEach(t => { daily[Number(t.date.slice(8, 10)) - 1] += t.amount; });

  return {
    month: month,
    total: total,
    prevTotal: prevTotal,
    prevSamePeriod: prevSamePeriod,
    budget: budget,
    count: cur.length,
    daysInMonth: days,
    daysElapsed: elapsed,
    avgPerDay: Math.round(avgRoutine),
    forecast: elapsed ? Math.round(total + avgRoutine * (days - elapsed)) : 0,
    byCategory: Object.keys(byCatMap).map(k => byCatMap[k])
      .filter(c => c.amount || c.budget)
      .sort((a, b) => b.amount - a.amount),
    daily: daily,
    top: cur.slice().sort((a, b) => b.amount - a.amount).slice(0, 5)
  };
}

/* ============================ Ghi / sửa / xóa ============================ */

function normalizeItem_(it, catNames, today) {
  const amount = Math.round(Number(String(it.amount).replace(/[^\d.-]/g, '')));
  if (!amount || amount <= 0) throw new Error('Số tiền không hợp lệ: ' + it.amount);
  const date = /^\d{4}-\d{2}-\d{2}$/.test(String(it.date)) ? String(it.date) : today;
  return {
    date: date,
    amount: amount,
    category: catNames.indexOf(it.category) >= 0 ? it.category : 'Khác',
    description: String(it.description || '').trim().slice(0, 200),
    method: METHODS.indexOf(it.method) >= 0 ? it.method : DEFAULT_METHOD,
    note: String(it.note || '').trim().slice(0, 300)
  };
}

function addTransactions(items) {
  if (!items || !items.length) return 0;
  const catNames = getCategories_().map(c => c.name);
  const today = todayStr_();
  const now = new Date();
  const rows = items.map(it => {
    const t = normalizeItem_(it, catNames, today);
    return [Utilities.getUuid().slice(0, 8), toDate_(t.date), t.amount, t.category, t.description, t.method, t.note, now];
  });
  return withLock_(() => {
    const sh = sheet_(SHEET_TX);
    sh.getRange(sh.getLastRow() + 1, 1, rows.length, TX_HEADERS.length).setValues(rows);
    return rows.length;
  });
}

function findRow_(sh, id) {
  const cell = sh.getRange('A:A').createTextFinder(String(id)).matchEntireCell(true).findNext();
  if (!cell) throw new Error('Không tìm thấy giao dịch ' + id);
  return cell.getRow();
}

function updateTransaction(tx) {
  const catNames = getCategories_().map(c => c.name);
  const t = normalizeItem_(tx, catNames, todayStr_());
  return withLock_(() => {
    const sh = sheet_(SHEET_TX);
    const row = findRow_(sh, tx.id);
    sh.getRange(row, 2, 1, 6).setValues([[toDate_(t.date), t.amount, t.category, t.description, t.method, t.note]]);
    return true;
  });
}

function deleteTransaction(id) {
  return withLock_(() => {
    const sh = sheet_(SHEET_TX);
    sh.deleteRow(findRow_(sh, id));
    return true;
  });
}

function saveBudgets(list) {
  return withLock_(() => {
    const sh = sheet_(SHEET_CAT);
    const n = sh.getLastRow() - 1;
    if (n < 1) return 0;
    const names = sh.getRange(2, 1, n, 1).getValues().map(r => String(r[0]).trim());
    const map = {};
    list.forEach(b => { map[b.name] = Math.max(0, Math.round(Number(b.budget) || 0)); });
    const vals = sh.getRange(2, 3, n, 1).getValues().map((r, i) => [names[i] in map ? map[names[i]] : r[0]]);
    sh.getRange(2, 3, n, 1).setValues(vals);
    return Object.keys(map).length;
  });
}

/* ============================ Tách câu nhập tự nhiên ============================ */

/** Trả về danh sách khoản chi để người dùng xác nhận (CHƯA lưu). */
function parseInput(text) {
  text = String(text || '').trim();
  if (!text) return { items: [], source: 'none' };
  const cats = getCategories_();
  const today = todayStr_();
  const provider = aiProvider_();
  if (provider) {
    try {
      return { items: parseWithAI_(text, cats, today), source: provider };
    } catch (e) {
      return { items: parseLocal_(text, cats, today), source: 'local', warning: aiName_() + ' lỗi, đã dùng bộ tách offline: ' + e.message };
    }
  }
  return { items: parseLocal_(text, cats, today), source: 'local' };
}

/** Bộ tách theo quy tắc — chạy không cần API. Hiểu: 45k, 1tr2, 1.200.000, 2,5tr, hôm qua, 05/10. */
function parseLocal_(text, cats, today) {
  const segments = String(text).split(/\n|;|,(?!\d)|\s\+\s|\svà\s/i).map(s => s.trim()).filter(Boolean);
  const out = [];
  let carryDate = null;
  segments.forEach(seg => {
    let s = ' ' + seg.toLowerCase() + ' ';
    // Ngày
    let date = null;
    const rel = [[/hôm kia/, -2], [/hôm qua/, -1], [/hôm nay/, 0]];
    for (let i = 0; i < rel.length; i++) {
      if (rel[i][0].test(s)) { date = addDays_(today, rel[i][1]); s = s.replace(rel[i][0], ' '); break; }
    }
    const dm = s.match(/(?:ngày\s*)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
    if (!date && dm) {
      let y = dm[3] ? Number(dm[3]) : Number(today.slice(0, 4));
      if (y < 100) y += 2000;
      const m = Number(dm[2]), d = Number(dm[1]);
      if (m >= 1 && m <= 12 && d >= 1 && d <= 31) {
        date = y + '-' + ('0' + m).slice(-2) + '-' + ('0' + d).slice(-2);
        s = s.replace(dm[0], ' ');
      }
    }
    if (date) carryDate = date;

    // Số tiền
    let amount = 0, m;
    const END = '(?=[^a-zà-ỹ]|$)';
    if ((m = s.match(new RegExp('(\\d+)\\s*(?:tr|triệu|m)\\s*(\\d+)' + END)))) {
      amount = parseFloat(m[1] + '.' + m[2]) * 1e6;
    } else if ((m = s.match(new RegExp('(\\d+(?:[.,]\\d+)?)\\s*(?:tr|triệu|m)' + END)))) {
      amount = parseFloat(m[1].replace(',', '.')) * 1e6;
    } else if ((m = s.match(new RegExp('(\\d+(?:[.,]\\d+)?)\\s*(?:k|nghìn|ngàn|n)' + END)))) {
      amount = parseFloat(m[1].replace(',', '.')) * 1e3;
    } else if ((m = s.match(/(\d{1,3}(?:[.,]\d{3})+|\d+)\s*(?:đ|d|vnd|vnđ|đồng)?(?=[^a-zà-ỹ\d]|$)/))) {
      amount = Number(m[1].replace(/[.,]/g, ''));
      if (amount > 0 && amount < 1000) amount *= 1000; // "phở 55" → 55.000
    }
    if (!m || !amount) return;
    s = s.replace(m[0], ' ');

    // Phương thức
    let method = DEFAULT_METHOD;
    // \b của JS không hiểu chữ có dấu → tự bắt ranh giới bằng khoảng trắng/dấu câu.
    const word = alt => new RegExp('(?:^|[\\s,.;])(?:' + alt + ')(?=[\\s,.;!?]|$)');
    const methodRules = [
      [word('chuyển khoản|ck'), 'Chuyển khoản'], [word('thẻ|visa|master|credit'), 'Thẻ'],
      [word('tiền mặt|tm|cash'), 'Tiền mặt'], [word('momo|zalopay|zalo pay|vnpay|shopeepay|ví'), 'Ví điện tử']
    ];
    for (let i = 0; i < methodRules.length; i++) {
      if (methodRules[i][0].test(s)) { method = methodRules[i][1]; s = s.replace(methodRules[i][0], ' '); break; }
    }

    const desc = s.replace(/(^|\s)(tiền|hết|mất|trả|chi)(?=\s|$)/g, ' ').replace(/\s+/g, ' ').trim();
    out.push({
      date: date || carryDate || today,
      amount: Math.round(amount),
      category: guessCategory_(seg.toLowerCase(), cats),
      description: desc ? desc.charAt(0).toUpperCase() + desc.slice(1) : seg,
      method: method
    });
  });
  return out;
}

/** Chọn danh mục có từ khóa khớp DÀI NHẤT (vd "mua cafe" → Ăn uống, không phải Mua sắm). */
function guessCategory_(text, cats) {
  let best = 'Khác', bestLen = 0;
  cats.forEach(c => c.keywords.forEach(k => {
    if (k.length > bestLen && text.indexOf(k) >= 0) { best = c.name; bestLen = k.length; }
  }));
  return best;
}

/* ============================ AI: Gemini (free) hoặc Claude ============================ */

/** Nhà cung cấp AI đang dùng: 'gemini' | 'claude' | '' (offline). */
function aiProvider_() {
  const p = String(prop_('AI_PROVIDER') || '').trim().toLowerCase();
  if (p === 'gemini' && prop_('GEMINI_API_KEY')) return 'gemini';
  if (p === 'claude' && prop_('ANTHROPIC_API_KEY')) return 'claude';
  if (p === 'off') return '';
  if (prop_('GEMINI_API_KEY')) return 'gemini';
  if (prop_('ANTHROPIC_API_KEY')) return 'claude';
  return '';
}

function aiName_() {
  return { gemini: 'Gemini', claude: 'Claude' }[aiProvider_()] || '';
}

/**
 * Gọi AI đang bật. task = { system, user, schema (JSON Schema, tùy chọn), effort: 'low'|'medium' }.
 * Có schema thì trả về object đã parse, không có thì trả về text.
 */
function callAI_(task) {
  const provider = aiProvider_();
  if (provider === 'gemini') return callGemini_(task);
  if (provider === 'claude') return callClaude_(task);
  throw new Error('Chưa cấu hình AI');
}

function callGemini_(task) {
  const model = prop_('GEMINI_MODEL') || DEFAULT_GEMINI_MODEL;
  const body = {
    systemInstruction: { parts: [{ text: task.system }] },
    contents: [{ role: 'user', parts: [{ text: task.user }] }],
    generationConfig: { temperature: 0.2 }
  };
  if (task.schema) {
    body.generationConfig.responseMimeType = 'application/json';
    body.generationConfig.responseSchema = toGeminiSchema_(task.schema);
  }
  const res = UrlFetchApp.fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', {
    method: 'post', contentType: 'application/json', headers: { 'x-goog-api-key': prop_('GEMINI_API_KEY') },
    payload: JSON.stringify(body), muteHttpExceptions: true
  });
  const code = res.getResponseCode();
  const json = JSON.parse(res.getContentText());
  if (code === 429) throw new Error('Gemini hết hạn mức miễn phí, thử lại sau');
  if (code !== 200) throw new Error('Gemini HTTP ' + code + ': ' + (json.error && json.error.message || res.getContentText().slice(0, 200)));
  const cand = (json.candidates || [])[0];
  if (!cand || !cand.content) throw new Error('Gemini không trả kết quả (' + (cand && cand.finishReason || (json.promptFeedback && json.promptFeedback.blockReason) || 'không rõ') + ')');
  if (cand.finishReason === 'MAX_TOKENS') throw new Error('Phản hồi bị cắt do quá dài');
  const text = cand.content.parts.filter(p => p.text && !p.thought).map(p => p.text).join('');
  return task.schema ? JSON.parse(text) : text;
}

/** Gemini dùng tập con OpenAPI: bỏ additionalProperties, kiểu viết hoa. */
function toGeminiSchema_(s) {
  const out = {};
  Object.keys(s).forEach(k => {
    if (k === 'additionalProperties') return;
    if (k === 'type') out.type = String(s.type).toUpperCase();
    else if (k === 'properties') {
      out.properties = {};
      Object.keys(s.properties).forEach(p => { out.properties[p] = toGeminiSchema_(s.properties[p]); });
    } else if (k === 'items') out.items = toGeminiSchema_(s.items);
    else out[k] = s[k];
  });
  return out;
}

function callClaude_(task) {
  const model = prop_('CLAUDE_MODEL') || DEFAULT_CLAUDE_MODEL;
  const headers = { 'x-api-key': prop_('ANTHROPIC_API_KEY'), 'anthropic-version': '2023-06-01' };
  const body = {
    model: model, max_tokens: 4000, system: task.system,
    messages: [{ role: 'user', content: task.user }]
  };
  // effort chỉ áp dụng cho các model đời mới (Opus/Sonnet/Fable 5.x); Haiku 4.5 không hỗ trợ.
  if (!/haiku/.test(model)) body.output_config = { effort: task.effort || 'medium' };
  if (task.schema) {
    body.output_config = body.output_config || {};
    body.output_config.format = { type: 'json_schema', schema: task.schema };
  }
  if (FALLBACK_MODELS.indexOf(model) >= 0) {
    headers['anthropic-beta'] = 'server-side-fallback-2026-07-01';
    body.fallbacks = 'default';
  }
  const res = UrlFetchApp.fetch('https://api.anthropic.com/v1/messages', {
    method: 'post', contentType: 'application/json', headers: headers,
    payload: JSON.stringify(body), muteHttpExceptions: true
  });
  const code = res.getResponseCode();
  const json = JSON.parse(res.getContentText());
  if (code !== 200) throw new Error('Claude HTTP ' + code + ': ' + (json.error && json.error.message || res.getContentText().slice(0, 200)));
  if (json.stop_reason === 'refusal') throw new Error('Claude từ chối xử lý yêu cầu này');
  if (json.stop_reason === 'max_tokens') throw new Error('Phản hồi bị cắt do quá dài');
  const text = json.content.filter(b => b.type === 'text').map(b => b.text).join('');
  return task.schema ? JSON.parse(text) : text;
}

function parseWithAI_(text, cats, today) {
  const catNames = cats.map(c => c.name);
  const weekday = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'][toDate_(today).getDay()];
  const system = [
    'Bạn tách ghi chú chi tiêu tiếng Việt thành danh sách giao dịch.',
    'Hôm nay là ' + today + ' (' + weekday + '). Đơn vị tiền: VND, trả về số nguyên.',
    'Quy ước: 45k = 45000; 1tr2 = 1200000; 2,5tr = 2500000; "1.200.000" = 1200000; số trơn dưới 1000 hiểu là nghìn (phở 55 = 55000).',
    'Ngày dạng yyyy-MM-dd. Hiểu "hôm qua", "hôm kia", "thứ 2 tuần trước", "05/10". Không nhắc ngày thì dùng hôm nay; một ngày được nhắc áp dụng cho các khoản liền sau nó.',
    'Danh mục chỉ được chọn trong danh sách sau (kèm từ khóa gợi ý):',
    cats.map(c => '- ' + c.name + (c.keywords.length ? ': ' + c.keywords.slice(0, 15).join(', ') : '')).join('\n'),
    'Phương thức: ' + METHODS.join(', ') + '. Không nhắc thì dùng "' + DEFAULT_METHOD + '". "ck" = Chuyển khoản, momo/zalopay = Ví điện tử.',
    'Mô tả: ngắn gọn, viết hoa chữ đầu, bỏ số tiền và ngày. Bỏ qua nội dung không phải khoản chi. Không có khoản nào thì trả về items rỗng.'
  ].join('\n');

  const schema = {
    type: 'object', additionalProperties: false, required: ['items'],
    properties: {
      items: {
        type: 'array',
        items: {
          type: 'object', additionalProperties: false,
          required: ['date', 'amount', 'category', 'description', 'method'],
          properties: {
            date: { type: 'string' },
            amount: { type: 'integer' },
            category: { type: 'string', enum: catNames },
            description: { type: 'string' },
            method: { type: 'string', enum: METHODS }
          }
        }
      }
    }
  };

  const out = callAI_({ system: system, user: text, schema: schema, effort: 'low' });
  return (out.items || []).map(it => normalizeItem_(it, catNames, today));
}

/** Nhận xét tháng: dùng AI nếu đã bật, nếu không (hoặc AI lỗi) thì tạo nhận xét theo quy tắc. */
function monthlyReview(month) {
  const d = getDashboard(month);
  if (!d.count) return '## Chưa có dữ liệu\nTháng ' + month + ' chưa có khoản chi nào.';
  if (!aiProvider_()) return localReview_(d);

  const summary = {
    thang: month,
    tong_chi: d.total, tong_ngan_sach: d.budget, thang_truoc: d.prevTotal,
    cung_ky_thang_truoc: d.prevSamePeriod,
    so_ngay_da_qua: d.daysElapsed, so_ngay_trong_thang: d.daysInMonth,
    du_bao_cuoi_thang: d.forecast,
    theo_danh_muc: d.byCategory.map(c => ({ danh_muc: c.name, chi: c.amount, ngan_sach: c.budget, thang_truoc: c.prev, so_giao_dich: c.count })),
    khoan_lon_nhat: d.top.map(t => ({ ngay: t.date, so_tien: t.amount, danh_muc: t.category, mo_ta: t.description })),
    chi_theo_ngay: d.daily
  };
  try {
    return callAI_({
      effort: 'medium',
      system: 'Bạn là cố vấn tài chính cá nhân, thực dụng, nói thẳng. Viết tiếng Việt, xưng "bạn". ' +
        'Dựa hoàn toàn vào số liệu được cung cấp, không bịa thêm. Định dạng tiền kiểu 1.250.000đ. ' +
        'Trả lời đúng cấu trúc Markdown sau, tổng dưới 250 từ:\n' +
        '## Tóm tắt\n(2-3 câu: tổng chi so với ngân sách và so với CÙNG KỲ tháng trước (cung_ky_thang_truoc), dự báo cuối tháng nếu tháng chưa hết)\n' +
        '## Điểm đáng chú ý\n(3 gạch đầu dòng, mỗi dòng có con số cụ thể: danh mục vượt/sắp vượt, thay đổi lớn, khoản bất thường)\n' +
        '## Hành động tháng tới\n(3 gạch đầu dòng, cụ thể và đo được, vd "Giới hạn Ăn uống 3.500.000đ, tối đa 2 lần ăn ngoài/tuần")',
      user: 'Số liệu chi tiêu:\n' + JSON.stringify(summary)
    });
  } catch (e) {
    return localReview_(d) + '\n- (' + aiName_() + ' lỗi: ' + e.message + '. Đang hiển thị nhận xét offline.)';
  }
}

function localReview_(d) {
  const f = n => Math.round(n).toLocaleString('vi-VN') + 'đ';
  const lines = ['## Tóm tắt'];
  lines.push('Tổng chi **' + f(d.total) + '** / ngân sách ' + f(d.budget) + ' (' + Math.round(d.total / (d.budget || 1) * 100) + '%).' +
    (d.prevSamePeriod ? ' So với cùng kỳ tháng trước (ngày 1–' + d.daysElapsed + '): ' + (d.total >= d.prevSamePeriod ? '+' : '') +
      Math.round((d.total - d.prevSamePeriod) / d.prevSamePeriod * 100) + '%.' : '') +
    (d.daysElapsed < d.daysInMonth ? ' Dự báo cuối tháng: ' + f(d.forecast) + '.' : ''));
  lines.push('## Điểm đáng chú ý');
  const over = d.byCategory.filter(c => c.budget && c.amount > c.budget);
  const near = d.byCategory.filter(c => c.budget && c.amount <= c.budget && c.amount >= c.budget * 0.8);
  if (d.byCategory[0]) lines.push('- Chi nhiều nhất: **' + d.byCategory[0].name + '** ' + f(d.byCategory[0].amount) + '.');
  over.forEach(c => lines.push('- Vượt ngân sách **' + c.name + '**: ' + f(c.amount) + ' / ' + f(c.budget) + '.'));
  near.forEach(c => lines.push('- Sắp chạm ngân sách **' + c.name + '** (' + Math.round(c.amount / c.budget * 100) + '%).'));
  if (d.top[0]) lines.push('- Khoản lớn nhất: ' + d.top[0].description + ' — ' + f(d.top[0].amount) + '.');
  lines.push('## Gợi ý');
  lines.push('- Bật AI (thêm GEMINI_API_KEY miễn phí trong Script properties) để có phân tích sâu và đề xuất hành động.');
  return lines.join('\n');
}

function seedDemoData() {
  const today = todayStr_();
  const cur = today.slice(0, 7), prev = prevMonth_(cur);
  const samples = [
    ['Ăn uống', 'Phở bò', 55000], ['Ăn uống', 'Cà phê Highlands', 49000], ['Ăn uống', 'Cơm trưa văn phòng', 45000],
    ['Ăn uống', 'Đi siêu thị WinMart', 650000], ['Ăn uống', 'Trà sữa', 38000], ['Ăn uống', 'Lẩu cuối tuần', 420000],
    ['Đi lại', 'Grab đi làm', 62000], ['Đi lại', 'Đổ xăng', 90000], ['Đi lại', 'Gửi xe tháng', 150000],
    ['Mua sắm', 'Áo sơ mi Shopee', 289000], ['Giải trí', 'Netflix', 260000], ['Giải trí', 'Xem phim CGV', 180000],
    ['Sức khỏe', 'Thuốc cảm', 120000], ['Học tập', 'Sách PMP', 350000], ['Gia đình & Hiếu hỉ', 'Mừng đám cưới', 1000000]
  ];
  const rows = [], now = new Date();
  [[prev, daysInMonth_(prev)], [cur, Number(today.slice(8, 10))]].forEach(([ym, lastDay]) => {
    const add = (day, cat, desc, amt, method) =>
      rows.push([Utilities.getUuid().slice(0, 8), toDate_(ym + '-' + ('0' + day).slice(-2)), amt, cat, desc, method, 'DEMO', now]);
    add(1, 'Nhà ở & Hóa đơn', 'Tiền thuê nhà', 5000000, 'Chuyển khoản');
    if (lastDay >= 5) add(5, 'Nhà ở & Hóa đơn', 'Tiền điện', 780000, 'Chuyển khoản');
    add(Math.min(lastDay, 10), 'Tiết kiệm & Đầu tư', 'Gửi tiết kiệm', 3000000, 'Chuyển khoản');
    for (let d = 1; d <= lastDay; d++) {
      const k = 1 + (d * 7) % 3;
      for (let j = 0; j < k; j++) {
        const s = samples[(d * 5 + j * 3) % samples.length];
        if (s[2] >= 1000000 && d % 9) continue;
        add(d, s[0], s[1], Math.round(s[2] * (0.85 + ((d + j) % 4) * 0.1) / 1000) * 1000, ['Thẻ', 'Ví điện tử', 'Tiền mặt', 'Chuyển khoản'][(d + j) % 4]);
      }
    }
  });
  withLock_(() => {
    const sh = sheet_(SHEET_TX);
    sh.getRange(sh.getLastRow() + 1, 1, rows.length, TX_HEADERS.length).setValues(rows);
  });
  return rows.length;
}

function removeDemoData() {
  return withLock_(() => {
    const sh = sheet_(SHEET_TX);
    const n = sh.getLastRow() - 1;
    if (n < 1) return 0;
    const range = sh.getRange(2, 1, n, TX_HEADERS.length);
    const keep = range.getValues().filter(r => r[6] !== 'DEMO');
    range.clearContent();
    if (keep.length) sh.getRange(2, 1, keep.length, TX_HEADERS.length).setValues(keep);
    return n - keep.length;
  });
}

  /* ---- hết Code.gs ---- */

  function reset() {
    sheets = {}; try { localStorage.removeItem(MOCK_KEY); } catch (e) {}
    setup(); seedDemoData(); persist();
  }
  if (!restore()) reset();
  return { getInitData, getTransactions, getRecent, getDashboard, addTransactions, updateTransaction, deleteTransaction, saveBudgets, parseInput, monthlyReview, reset };
})();

window.google = { script: { get run() {
  let ok = () => {}, err = () => {};
  const px = new Proxy({}, { get(t, k) {
    if (k === 'withSuccessHandler') return f => { ok = f; return px; };
    if (k === 'withFailureHandler') return f => { err = f; return px; };
    return (...a) => setTimeout(() => {
      try { ok(JSON.parse(JSON.stringify(Backend[k].apply(null, JSON.parse(JSON.stringify(a)))))); }
      catch (e) { err(e); }
    }, 120);
  } });
  return px;
} } };
</script>

<script>
/* ===== Bảng góp ý mockup ===== */
const FB = [["entry","Ghi nhanh bằng câu tự nhiên","Thử gõ \"trưa phở 55k, grab 32k\" → Phân tích → Lưu. Có đủ nhanh để ghi mỗi ngày không?"],["categories","10 danh mục chi tiêu","Ăn uống, Đi lại, Nhà ở & Hóa đơn, Mua sắm, Sức khỏe, Học tập, Giải trí, Gia đình & Hiếu hỉ, Tiết kiệm & Đầu tư, Khác. Thiếu/thừa gì?"],["method","Phương thức thanh toán","Chuyển khoản / Thẻ / Tiền mặt / Ví điện tử. Có cần ghi rõ thẻ nào, tài khoản nào không?"],["dashboard","Tổng quan tháng","4 KPI, cảnh báo dự báo vượt ngân sách, chi theo danh mục, theo ngày, top 5 khoản. Đúng thứ Rio cần nhìn?"],["budget","Ngân sách theo danh mục","Mức mẫu tổng 19,3 triệu/tháng. Cách đặt theo từng danh mục có phù hợp?"],["history","Lịch sử & sửa/xóa","Lọc theo tháng, danh mục, tìm kiếm; bấm vào khoản để sửa/xóa."],["review","Nhận xét cuối tháng","Bản mockup dùng nhận xét theo quy tắc; bật AI (Gemini/Claude) sẽ có phân tích và 3 hành động cụ thể."]];
const WISHES = ["Theo dõi thu nhập","Khoản chi định kỳ tự động","Mục tiêu tiết kiệm","Dùng chung với gia đình","Nhiều ví / tài khoản","Chụp hóa đơn","Email tổng kết hằng tháng","Xuất báo cáo"];
const FB_KEY = 'so-chi-tieu-feedback-v1';
let fb = {};
try { fb = JSON.parse(localStorage.getItem(FB_KEY) || '{}'); } catch (e) {}
const saveFb = () => { try { localStorage.setItem(FB_KEY, JSON.stringify(fb)); } catch (e) {} };

function openFeedback() {
  fb.wish = fb.wish || [];
  const seg = (id, v) => ['Ổn', 'Cần chỉnh', 'Bỏ'].map(o =>
    '<button class="' + (v === o ? 'on' : '') + '" onclick="setFb(\'' + id + '\',\'' + o + '\',this)">' + o + '</button>').join('');
  openModal('<div class="row"><h2 class="grow" style="margin:0">Góp ý cho mockup</h2><button class="ghost" onclick="closeModal()">Đóng</button></div>' +
    '<p class="muted">Đánh giá từng phần, ghi chú chỗ cần chỉnh, rồi bấm <b>Copy góp ý</b> và dán vào chat với Claude.</p>' +
    FB.map(([id, q, hint]) => '<div class="fb-item"><div class="fb-q">' + esc(q) + '</div><div class="fb-hint">' + esc(hint) + '</div>' +
      '<div class="seg" id="seg-' + id + '">' + seg(id, (fb[id] || {}).v) + '</div>' +
      '<textarea id="note-' + id + '" placeholder="Ghi chú (không bắt buộc)" oninput="noteFb(\'' + id + '\',this.value)">' + esc((fb[id] || {}).n || '') + '</textarea></div>').join('') +
    '<div class="fb-item"><div class="fb-q">Muốn có thêm</div><div class="fb-hint">Chọn những tính năng Rio thấy cần.</div><div class="seg" id="wish">' +
      WISHES.map((w, i) => '<button class="' + (fb.wish.indexOf(w) >= 0 ? 'on' : '') + '" onclick="toggleWish(' + i + ',this)">' + esc(w) + '</button>').join('') +
    '</div><textarea id="note-other" placeholder="Ý khác…" oninput="noteFb(\'other\',this.value)">' + esc((fb.other || {}).n || '') + '</textarea></div>' +
    '<div class="row" style="margin-top:12px"><span class="grow"></span><button class="primary" onclick="copyFb()">Copy góp ý</button></div>' +
    '<textarea id="fbOut" class="hidden" readonly></textarea>');
}
function setFb(id, v, el) {
  fb[id] = fb[id] || {}; fb[id].v = fb[id].v === v ? '' : v; saveFb();
  el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.textContent === fb[id].v));
}
function noteFb(id, v) { fb[id] = fb[id] || {}; fb[id].n = v; saveFb(); }
function toggleWish(i, el) {
  const w = WISHES[i], k = fb.wish.indexOf(w);
  if (k >= 0) fb.wish.splice(k, 1); else fb.wish.push(w);
  el.classList.toggle('on', k < 0); saveFb();
}
function fbText() {
  const lines = ['GÓP Ý MOCKUP SỔ CHI TIÊU'];
  FB.forEach(([id, q]) => { const x = fb[id] || {}; if (x.v || x.n) lines.push('- ' + q + ': ' + (x.v || '—') + (x.n ? ' | ' + x.n : '')); });
  if (fb.wish && fb.wish.length) lines.push('- Muốn thêm: ' + fb.wish.join(', '));
  if (fb.other && fb.other.n) lines.push('- Ý khác: ' + fb.other.n);
  if (lines.length === 1) lines.push('(chưa có góp ý)');
  return lines.join('\n');
}
function copyFb() {
  const t = fbText(), out = $('fbOut');
  out.value = t; out.classList.remove('hidden');
  const done = () => toast('Đã copy, dán vào chat với Claude nhé');
  const fallback = () => { out.focus(); out.select(); toast('Hãy chọn và copy đoạn bên dưới'); };
  try { navigator.clipboard.writeText(t).then(done, fallback); } catch (e) { fallback(); }
}
function resetMock() {
  const b = $('btnReset');
  if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Bấm lần nữa'; setTimeout(() => { delete b.dataset.armed; b.textContent = 'Đặt lại dữ liệu'; }, 3000); return; }
  Backend.reset(); delete b.dataset.armed; b.textContent = 'Đặt lại dữ liệu';
  toast('Đã nạp lại dữ liệu mẫu'); refreshCurrent();
}

/* ---------------- Trạng thái & tiện ích ---------------- */
const S = { init: null, preview: [], dashMonth: null, cats: {} };

function api(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn].apply(null, args);
  });
}
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const vnd = n => Math.round(n || 0).toLocaleString('vi-VN') + 'đ';
const short = n => n >= 1e6 ? (n / 1e6).toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + 'tr' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);
const digits = s => Number(String(s).replace(/\D/g, '')) || 0;
const icon = name => (S.cats[name] && S.cats[name].icon) || '•';
const ymLabel = ym => 'Tháng ' + Number(ym.slice(5)) + '/' + ym.slice(0, 4);
const dLabel = ymd => {
  const t = S.init.today;
  if (ymd === t) return 'Hôm nay';
  const d = new Date(ymd + 'T00:00:00'), td = new Date(t + 'T00:00:00');
  if ((td - d) / 864e5 === 1) return 'Hôm qua';
  return ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][d.getDay()] + ', ' + ymd.slice(8) + '/' + ymd.slice(5, 7);
};
function toast(msg, ms) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), ms || 2600);
}
function busy(btn, on, label) {
  if (on) { btn.dataset.l = btn.innerHTML; btn.innerHTML = '<span class="spin"></span> ' + (label || ''); btn.disabled = true; }
  else { btn.innerHTML = btn.dataset.l; btn.disabled = false; }
}
function fail(e) { toast('Lỗi: ' + (e && e.message || e), 4500); }
function catOptions(sel) {
  return S.init.categories.map(c => '<option' + (c.name === sel ? ' selected' : '') + ' value="' + esc(c.name) + '">' + c.icon + ' ' + esc(c.name) + '</option>').join('');
}
function methodOptions(sel) {
  return S.init.methods.map(m => '<option' + (m === sel ? ' selected' : '') + '>' + esc(m) + '</option>').join('');
}
function fmtInput(el) { const n = digits(el.value); el.value = n ? n.toLocaleString('vi-VN') : ''; }

/* ---------------- Điều hướng ---------------- */
function go(tab) {
  ['add', 'dash', 'hist', 'budget'].forEach(t => $('tab-' + t).classList.toggle('hidden', t !== tab));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  window.scrollTo(0, 0);
  if (tab === 'add') loadRecent();
  if (tab === 'dash') loadDash();
  if (tab === 'hist') loadHistory();
  if (tab === 'budget') renderBudgets();
}

/* ---------------- Ghi nhanh ---------------- */
const EXAMPLES = ['trưa phở 55k, cafe 45k', 'grab 32k', 'hôm qua siêu thị 650k thẻ', 'tiền điện 780k ck'];
function renderExamples() {
  $('examples').innerHTML = EXAMPLES.map(e => '<span class="chip">' + esc(e) + '</span>').join('');
  $('examples').querySelectorAll('.chip').forEach((c, i) => c.onclick = () => {
    const q = $('quick'); q.value = (q.value.trim() ? q.value.trim() + ', ' : '') + EXAMPLES[i]; q.focus();
  });
}

async function doParse() {
  const text = $('quick').value.trim();
  if (!text) { $('quick').focus(); return; }
  const btn = $('btnParse'); busy(btn, true, 'Đang đọc');
  try {
    const r = await api('parseInput', text);
    if (r.warning) toast(r.warning, 4500);
    if (!r.items.length) { toast('Không tìm thấy số tiền nào. Thử "phở 55k".'); return; }
    S.preview = r.items; renderPreview();
  } catch (e) { fail(e); } finally { busy(btn, false); }
}

function renderPreview() {
  $('previewWrap').classList.toggle('hidden', !S.preview.length);
  $('previewList').innerHTML = S.preview.map((it, i) => `
    <div class="preview">
      <div class="row">
        <input class="grow" value="${esc(it.description)}" oninput="S.preview[${i}].description=this.value" placeholder="Mô tả">
        <button class="ghost" title="Bỏ" onclick="S.preview.splice(${i},1);renderPreview()">✕</button>
      </div>
      <div class="grid2" style="margin-top:8px">
        <input class="num" inputmode="numeric" value="${it.amount.toLocaleString('vi-VN')}" onblur="fmtInput(this)" oninput="S.preview[${i}].amount=digits(this.value);updPreviewTotal()">
        <input type="date" value="${it.date}" onchange="S.preview[${i}].date=this.value">
        <select onchange="S.preview[${i}].category=this.value">${catOptions(it.category)}</select>
        <select onchange="S.preview[${i}].method=this.value">${methodOptions(it.method)}</select>
      </div>
    </div>`).join('');
  updPreviewTotal();
}
function updPreviewTotal() {
  const t = S.preview.reduce((s, x) => s + (x.amount || 0), 0);
  $('previewTotal').innerHTML = S.preview.length + ' khoản · <b class="num">' + vnd(t) + '</b>';
  $('btnSave').textContent = 'Lưu ' + S.preview.length + ' khoản';
}
function clearPreview() { S.preview = []; renderPreview(); }

async function savePreview() {
  if (S.preview.some(x => !x.amount)) { toast('Có khoản chưa có số tiền.'); return; }
  const btn = $('btnSave'); busy(btn, true, 'Đang lưu');
  try {
    const n = await api('addTransactions', S.preview);
    toast('Đã lưu ' + n + ' khoản ✓');
    $('quick').value = ''; clearPreview(); loadRecent();
  } catch (e) { fail(e); } finally { busy(btn, false); updPreviewTotal(); }
}

async function loadRecent() {
  try {
    const r = await api('getRecent', 6);
    $('todayTotal').textContent = vnd(r.todayTotal);
    $('recent').innerHTML = r.items.length ? r.items.map(txRow).join('') : '<div class="empty">Chưa có khoản nào. Ghi khoản đầu tiên ở trên nhé.</div>';
    bindTx($('recent'), r.items);
  } catch (e) { fail(e); }
}

function txRow(t) {
  return `<div class="tx" data-id="${esc(t.id)}">
    <div class="ic">${icon(t.category)}</div>
    <div class="grow"><div>${esc(t.description || t.category)}</div>
      <div class="muted">${esc(t.category)} · ${dLabel(t.date)} · ${esc(t.method)}</div></div>
    <div class="amt num">${vnd(t.amount)}</div></div>`;
}
function bindTx(container, list) {
  container.querySelectorAll('.tx').forEach(el => el.onclick = () => openEdit(list.find(t => t.id === el.dataset.id)));
}

/* ---------------- Modal: nhập tay / sửa ---------------- */
function txForm(t) {
  return `
    <label>Mô tả</label><input id="fDesc" value="${esc(t.description || '')}" placeholder="Ví dụ: Cơm trưa">
    <div class="grid2" style="margin-top:8px">
      <div><label>Số tiền (đ)</label><input id="fAmt" class="num" inputmode="numeric" value="${t.amount ? t.amount.toLocaleString('vi-VN') : ''}" onblur="fmtInput(this)"></div>
      <div><label>Ngày</label><input id="fDate" type="date" value="${t.date || S.init.today}"></div>
      <div><label>Danh mục</label><select id="fCat">${catOptions(t.category || 'Ăn uống')}</select></div>
      <div><label>Phương thức</label><select id="fMethod">${methodOptions(t.method || S.init.defaultMethod)}</select></div>
    </div>
    <label>Ghi chú</label><input id="fNote" value="${esc(t.note || '')}">`;
}
function readForm() {
  return { description: $('fDesc').value, amount: digits($('fAmt').value), date: $('fDate').value,
    category: $('fCat').value, method: $('fMethod').value, note: $('fNote').value };
}
function openModal(html) { $('modalBody').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal() { $('modal').classList.add('hidden'); }

function openManual() {
  openModal('<h2>Nhập tay</h2>' + txForm({}) +
    '<div class="row" style="margin-top:14px"><span class="grow"></span><button class="ghost" onclick="closeModal()">Hủy</button><button class="primary" id="btnM" onclick="saveManual()">Lưu</button></div>');
  setTimeout(() => $('fAmt').focus(), 50);
}
async function saveManual() {
  const t = readForm(); if (!t.amount) { toast('Nhập số tiền'); return; }
  const btn = $('btnM'); busy(btn, true);
  try { await api('addTransactions', [t]); closeModal(); toast('Đã lưu ✓'); refreshCurrent(); }
  catch (e) { fail(e); busy(btn, false); }
}

function openEdit(t) {
  if (!t) return;
  S.editing = t;
  openModal('<h2>Sửa khoản chi</h2>' + txForm(t) +
    '<div class="row" style="margin-top:14px"><button class="danger" id="btnDel" onclick="delTx()">Xóa</button><span class="grow"></span><button class="ghost" onclick="closeModal()">Hủy</button><button class="primary" id="btnE" onclick="saveEdit()">Lưu</button></div>');
}
async function saveEdit() {
  const t = Object.assign(readForm(), { id: S.editing.id }); if (!t.amount) { toast('Nhập số tiền'); return; }
  const btn = $('btnE'); busy(btn, true);
  try { await api('updateTransaction', t); closeModal(); toast('Đã cập nhật ✓'); refreshCurrent(); }
  catch (e) { fail(e); busy(btn, false); }
}
async function delTx() {
  const btn = $('btnDel');
  if (!btn.dataset.armed) { btn.dataset.armed = '1'; btn.textContent = 'Bấm lần nữa để xóa'; return; }
  try { await api('deleteTransaction', S.editing.id); closeModal(); toast('Đã xóa'); refreshCurrent(); }
  catch (e) { fail(e); }
}
function refreshCurrent() {
  const b = document.querySelector('nav button.active'); go(b ? b.dataset.tab : 'add');
}

/* ---------------- Tổng quan ---------------- */
function shiftMonth(n) {
  const p = S.dashMonth.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1 + n, 1);
  S.dashMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  loadDash();
}

async function loadDash() {
  $('dashMonth').textContent = ymLabel(S.dashMonth);
  $('dash').innerHTML = '<div class="empty"><span class="spin"></span></div>';
  try { renderDash(await api('getDashboard', S.dashMonth)); } catch (e) { fail(e); }
}

function renderDash(d) {
  const pctBudget = d.budget ? d.total / d.budget * 100 : 0;
  const delta = d.prevSamePeriod ? (d.total - d.prevSamePeriod) / d.prevSamePeriod * 100 : null;
  const fullMonth = d.daysElapsed >= d.daysInMonth;
  const remain = d.budget - d.total;
  const kpi = (label, value, sub, cls) => `<div class="kpi"><div class="s">${label}</div><div class="v num ${cls || ''}">${value}</div><div class="s">${sub}</div></div>`;

  let html = '<div class="kpis">' +
    kpi('Tổng chi', vnd(d.total), d.count + ' giao dịch') +
    kpi('Ngân sách còn', vnd(remain), Math.round(pctBudget) + '% đã dùng', remain < 0 ? 'up' : '') +
    kpi(fullMonth ? 'So tháng trước' : 'So cùng kỳ tháng trước', delta == null ? '—' : (delta >= 0 ? '▲ ' : '▼ ') + Math.abs(Math.round(delta)) + '%',
        (fullMonth ? 'Tháng trước ' : 'Ngày 1–' + d.daysElapsed + ': ') + short(d.prevSamePeriod), delta == null ? '' : delta > 0 ? 'up' : 'down') +
    kpi('Chi thường / ngày', vnd(d.avgPerDay), d.daysElapsed && d.daysElapsed < d.daysInMonth ? 'Dự báo ' + short(d.forecast) : d.daysElapsed + ' ngày') +
    '</div>';

  if (d.daysElapsed && d.daysElapsed < d.daysInMonth && d.budget && d.forecast > d.budget) {
    html += `<div class="card" style="border-color:var(--warn)">⚠️ Với tốc độ hiện tại, cuối tháng sẽ chi khoảng <b>${vnd(d.forecast)}</b>, vượt ngân sách <b>${vnd(d.forecast - d.budget)}</b>.</div>`;
  }

  html += '<div class="card"><h2>Theo danh mục</h2>' + (d.byCategory.filter(c => c.amount || c.budget).map(c => {
    const p = c.budget ? c.amount / c.budget * 100 : (c.amount ? 100 : 0);
    const cls = p > 100 ? 'bad' : p >= 80 ? 'warn' : '';
    return `<div class="cat-row"><div class="row">
        <span>${c.icon}</span><span class="grow">${esc(c.name)}</span>
        <span class="num"><b>${vnd(c.amount)}</b> <span class="muted">/ ${c.budget ? short(c.budget) : '—'}</span></span></div>
        <div class="bar"><i class="${cls}" style="width:${Math.min(100, p)}%"></i></div></div>`;
  }).join('') || '<div class="empty">Chưa có dữ liệu</div>') + '</div>';

  html += '<div class="card"><h2>Chi theo ngày</h2>' + dailyChart(d.daily) + '</div>';

  html += '<div class="card"><h2>5 khoản lớn nhất</h2>' + (d.top.length ? d.top.map(txRow).join('') : '<div class="empty">—</div>') + '</div>';

  html += `<div class="card"><div class="row"><h2 class="grow" style="margin:0">🤖 Nhận xét tháng</h2>
    <button id="btnReview" onclick="doReview()">${S.init.aiName ? 'Hỏi ' + esc(S.init.aiName) : 'Tạo nhận xét'}</button></div>
    <div id="review" class="review" style="margin-top:10px"></div></div>`;

  $('dash').innerHTML = html;
  const topBox = $('dash').querySelectorAll('.card')[$('dash').querySelectorAll('.card').length - 2];
  bindTx(topBox, d.top);
}

function dailyChart(daily) {
  const max = Math.max.apply(null, daily.concat([1]));
  const n = daily.length, w = 100 / n;
  const bars = daily.map((v, i) => {
    const h = v / max * 100;
    return `<rect x="${i * w + w * 0.15}" y="${100 - h}" width="${w * 0.7}" height="${h}" rx="0.6" fill="var(--brand)" opacity="${v ? 1 : 0}"><title>Ngày ${i + 1}: ${vnd(v)}</title></rect>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 100 100" preserveAspectRatio="none">${bars}</svg>
    <div class="row muted" style="font-size:11px"><span class="grow">1</span><span class="grow" style="text-align:center">${Math.ceil(n / 2)}</span><span>${n}</span></div>
    <div class="muted" style="font-size:12px;margin-top:4px">Cao nhất: ${vnd(max === 1 ? 0 : max)}/ngày</div>`;
}

async function doReview() {
  const btn = $('btnReview'); busy(btn, true, 'Đang phân tích');
  try { $('review').innerHTML = md(await api('monthlyReview', S.dashMonth)); }
  catch (e) { fail(e); } finally { busy(btn, false); }
}

/** Markdown tối giản: ##, -, **bold** (đã escape HTML trước). */
function md(text) {
  const out = []; let inList = false;
  esc(text).split('\n').forEach(line => {
    const l = line.trim().replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    if (/^[-*•]\s+/.test(l)) { if (!inList) { out.push('<ul>'); inList = true; } out.push('<li>' + l.replace(/^[-*•]\s+/, '') + '</li>'); return; }
    if (inList) { out.push('</ul>'); inList = false; }
    if (/^#{1,3}\s+/.test(l)) out.push('<h3>' + l.replace(/^#{1,3}\s+/, '') + '</h3>');
    else if (l) out.push('<p>' + l + '</p>');
  });
  if (inList) out.push('</ul>');
  return out.join('');
}

/* ---------------- Lịch sử ---------------- */
let hTimer;
function debounceHistory() { clearTimeout(hTimer); hTimer = setTimeout(loadHistory, 350); }

async function loadHistory() {
  $('hist').innerHTML = '<div class="empty"><span class="spin"></span></div>';
  try {
    const list = await api('getTransactions', $('hMonth').value, $('hCat').value, $('hQ').value);
    const total = list.reduce((s, t) => s + t.amount, 0);
    $('hSummary').innerHTML = list.length + ' khoản · <b class="num">' + vnd(total) + '</b>';
    if (!list.length) { $('hist').innerHTML = '<div class="empty">Không có giao dịch phù hợp</div>'; return; }
    const groups = {}; list.forEach(t => (groups[t.date] = groups[t.date] || []).push(t));
    $('hist').innerHTML = Object.keys(groups).map(d =>
      `<div class="day-h"><span>${dLabel(d)}</span><span class="num">${vnd(groups[d].reduce((s, t) => s + t.amount, 0))}</span></div>` +
      groups[d].map(txRow).join('')).join('');
    bindTx($('hist'), list);
  } catch (e) { fail(e); }
}

  $('budgetList').innerHTML = S.init.categories.map((c, i) => `

  }
})();

<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #17202a; --muted: #6b7785; --line: #e3e8ee;
    --brand: #0f766e; --brand-soft: #e6f4f2; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
    --radius: 14px; --shadow: 0 1px 3px rgba(16, 24, 40, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1419; --card: #182028; --text: #e6edf3; --muted: #93a1b0; --line: #2a3541;
      --brand: #2dd4bf; --brand-soft: #123a37; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px 96px; }
  h1 { font-size: 20px; margin: 4px 0 14px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .hidden { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }

  textarea, input, select { width: 100%; font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  textarea { min-height: 84px; resize: vertical; }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: -1px; border-color: transparent; }
  label { font-size: 12px; color: var(--muted); display: block; margin: 8px 0 4px; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer;
    background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  button.primary { background: var(--brand); color: #fff; }
  @media (prefers-color-scheme: dark) { button.primary { color: #062a27; } }
  button.ghost { background: transparent; color: var(--muted); padding: 6px 8px; }
  button.danger { background: transparent; color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { font-size: 12px; padding: 5px 10px; border-radius: 999px; background: var(--bg);
    border: 1px solid var(--line); color: var(--muted); cursor: pointer; font-weight: 500; }

  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
  @media (min-width: 620px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow); }
  .kpi .v { font-size: 19px; font-weight: 700; margin-top: 2px; }
  .kpi .s { font-size: 12px; color: var(--muted); }
  .up { color: var(--bad); } .down { color: var(--ok); }

  .bar { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; border-radius: 99px; background: var(--ok); }
  .bar > i.warn { background: var(--warn); } .bar > i.bad { background: var(--bad); }
  .cat-row { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .cat-row:last-child { border-bottom: 0; }

  .tx { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .tx:last-child { border-bottom: 0; }
  .tx .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--bg); display: grid; place-items: center; flex: none; }
  .tx .amt { font-weight: 700; white-space: nowrap; }
  .day-h { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted);
    margin: 14px 0 2px; text-transform: uppercase; letter-spacing: .03em; }

  .preview { border: 1px dashed var(--line); border-radius: 12px; padding: 10px; margin-top: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid2 label { margin-top: 0; }

  nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--line);
    display: flex; justify-content: center; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 5; }
  nav button { flex: 1; max-width: 160px; background: transparent; color: var(--muted); font-size: 12px;
    font-weight: 600; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav button span { font-size: 20px; line-height: 1; }
  nav button.active { color: var(--brand); }

  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .month-nav strong { font-size: 17px; }
  .chart { width: 100%; height: 120px; display: block; }
  .review h3 { font-size: 14px; margin: 12px 0 4px; } .review h3:first-child { margin-top: 0; }
  .review ul { margin: 4px 0; padding-left: 18px; } .review p { margin: 4px 0; }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .modal .sheet { background: var(--card); width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 92vh; overflow: auto; }
  @media (min-width: 620px) { .modal { align-items: center; } .modal .sheet { border-radius: 18px; } }
  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: s .7s linear infinite; vertical-align: -2px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .empty { text-align: center; color: var(--muted); padding: 24px 8px; }
</style>
</head>
<body>
<main>
  <!-- ============ TAB: GHI NHANH ============ -->
  <section id="tab-add">
    <h1>Ghi chi tiêu</h1>
    <div class="card">
      <textarea id="quick" placeholder="Gõ tự nhiên, ví dụ:&#10;trưa phở 55k, grab 32k&#10;hôm qua siêu thị 650k thẻ"></textarea>
      <div class="chips" id="examples"></div>
      <div class="row" style="margin-top:10px">
        <span class="muted grow" id="engine"></span>
        <button class="ghost" onclick="openManual()">+ Nhập tay</button>
        <button class="primary" id="btnParse" onclick="doParse()">Phân tích</button>
      </div>
      <div id="previewWrap" class="hidden">
        <div id="previewList"></div>
        <div class="row" style="margin-top:10px">
          <span class="muted grow" id="previewTotal"></span>
          <button class="ghost" onclick="clearPreview()">Hủy</button>
          <button class="primary" id="btnSave" onclick="savePreview()">Lưu</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="row"><h2 class="grow" style="margin:0">Gần đây</h2><span class="muted">Hôm nay: <b id="todayTotal" class="num">—</b></span></div>
      <div id="recent"></div>
    </div>
  </section>

  <!-- ============ TAB: TỔNG QUAN ============ -->
  <section id="tab-dash" class="hidden">
    <div class="month-nav">
      <button class="ghost" onclick="shiftMonth(-1)">‹ Trước</button>
      <strong id="dashMonth"></strong>
      <button class="ghost" onclick="shiftMonth(1)">Sau ›</button>
    </div>
    <div id="dash"></div>
  </section>

  <!-- ============ TAB: LỊCH SỬ ============ -->
  <section id="tab-hist" class="hidden">
    <h1>Lịch sử</h1>
    <div class="card">
      <div class="grid2">
        <input type="month" id="hMonth" onchange="loadHistory()">
        <select id="hCat" onchange="loadHistory()"></select>
      </div>
      <input id="hQ" placeholder="Tìm mô tả…" style="margin-top:8px" oninput="debounceHistory()">
    </div>
    <div class="card"><div class="row"><span class="grow muted" id="hSummary"></span></div><div id="hist"></div></div>
  </section>

  <!-- ============ TAB: NGÂN SÁCH ============ -->
  <section id="tab-budget" class="hidden">
    <h1>Ngân sách tháng</h1>
    <div class="card">
      <p class="muted" style="margin-top:0">Hạn mức chi mỗi tháng cho từng danh mục. Muốn thêm/đổi tên danh mục hoặc từ khóa nhận diện, sửa trực tiếp sheet <b>DanhMuc</b>.</p>
      <div id="budgetList"></div>
      <div class="row" style="margin-top:12px">
        <span class="grow muted">Tổng: <b id="budgetTotal" class="num"></b></span>
        <button class="primary" id="btnBudget" onclick="saveBudgetForm()">Lưu ngân sách</button>
      </div>
    </div>
    <div class="card"><a id="sheetLink" target="_blank" style="color:var(--brand)">Mở Google Sheet dữ liệu ↗</a></div>
  </section>
</main>

<nav>
  <button data-tab="add" class="active" onclick="go('add')"><span>✍️</span>Ghi</button>
  <button data-tab="dash" onclick="go('dash')"><span>📊</span>Tổng quan</button>
  <button data-tab="hist" onclick="go('hist')"><span>📜</span>Lịch sử</button>
  <button data-tab="budget" onclick="go('budget')"><span>🎯</span>Ngân sách</button>
</nav>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet" id="modalBody"></div></div>

<script>
/* ---------------- Trạng thái & tiện ích ---------------- */
const S = { init: null, preview: [], dashMonth: null, cats: {} };

function api(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn].apply(null, args);
  });
}
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const vnd = n => Math.round(n || 0).toLocaleString('vi-VN') + 'đ';
const short = n => n >= 1e6 ? (n / 1e6).toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + 'tr' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);
const digits = s => Number(String(s).replace(/\D/g, '')) || 0;
const icon = name => (S.cats[name] && S.cats[name].icon) || '•';
const ymLabel = ym => 'Tháng ' + Number(ym.slice(5)) + '/' + ym.slice(0, 4);
const dLabel = ymd => {
  const t = S.init.today;
  if (ymd === t) return 'Hôm nay';
  const d = new Date(ymd + 'T00:00:00'), td = new Date(t + 'T00:00:00');
  if ((td - d) / 864e5 === 1) return 'Hôm qua';
  return ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][d.getDay()] + ', ' + ymd.slice(8) + '/' + ymd.slice(5, 7);
};
function toast(msg, ms) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), ms || 2600);
}
function busy(btn, on, label) {
  if (on) { btn.dataset.l = btn.innerHTML; btn.innerHTML = '<span class="spin"></span> ' + (label || ''); btn.disabled = true; }
  else { btn.innerHTML = btn.dataset.l; btn.disabled = false; }
}
function fail(e) { toast('Lỗi: ' + (e && e.message || e), 4500); }
function catOptions(sel) {
  return S.init.categories.map(c => '<option' + (c.name === sel ? ' selected' : '') + ' value="' + esc(c.name) + '">' + c.icon + ' ' + esc(c.name) + '</option>').join('');
}
function methodOptions(sel) {
  return S.init.methods.map(m => '<option' + (m === sel ? ' selected' : '') + '>' + esc(m) + '</option>').join('');
}
function fmtInput(el) { const n = digits(el.value); el.value = n ? n.toLocaleString('vi-VN') : ''; }

/* ---------------- Điều hướng ---------------- */
function go(tab) {
  ['add', 'dash', 'hist', 'budget'].forEach(t => $('tab-' + t).classList.toggle('hidden', t !== tab));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  window.scrollTo(0, 0);
  if (tab === 'add') loadRecent();
  if (tab === 'dash') loadDash();
  if (tab === 'hist') loadHistory();
  if (tab === 'budget') renderBudgets();
}

/* ---------------- Ghi nhanh ---------------- */
const EXAMPLES = ['trưa phở 55k, cafe 45k', 'grab 32k', 'hôm qua siêu thị 650k thẻ', 'tiền điện 780k ck'];
function renderExamples() {
  $('examples').innerHTML = EXAMPLES.map(e => '<span class="chip">' + esc(e) + '</span>').join('');
  $('examples').querySelectorAll('.chip').forEach((c, i) => c.onclick = () => {
    const q = $('quick'); q.value = (q.value.trim() ? q.value.trim() + ', ' : '') + EXAMPLES[i]; q.focus();
  });
}

async function doParse() {
  const text = $('quick').value.trim();
  if (!text) { $('quick').focus(); return; }
  const btn = $('btnParse'); busy(btn, true, 'Đang đọc');
  try {
    const r = await api('parseInput', text);
    if (r.warning) toast(r.warning, 4500);
    if (!r.items.length) { toast('Không tìm thấy số tiền nào. Thử "phở 55k".'); return; }
    S.preview = r.items; renderPreview();
  } catch (e) { fail(e); } finally { busy(btn, false); }
}

function renderPreview() {
  $('previewWrap').classList.toggle('hidden', !S.preview.length);
  $('previewList').innerHTML = S.preview.map((it, i) => `
    <div class="preview">
      <div class="row">
        <input class="grow" value="${esc(it.description)}" oninput="S.preview[${i}].description=this.value" placeholder="Mô tả">
        <button class="ghost" title="Bỏ" onclick="S.preview.splice(${i},1);renderPreview()">✕</button>
      </div>
      <div class="grid2" style="margin-top:8px">
        <input class="num" inputmode="numeric" value="${it.amount.toLocaleString('vi-VN')}" onblur="fmtInput(this)" oninput="S.preview[${i}].amount=digits(this.value);updPreviewTotal()">
        <input type="date" value="${it.date}" onchange="S.preview[${i}].date=this.value">
        <select onchange="S.preview[${i}].category=this.value">${catOptions(it.category)}</select>
        <select onchange="S.preview[${i}].method=this.value">${methodOptions(it.method)}</select>
      </div>
    </div>`).join('');
  updPreviewTotal();
}
function updPreviewTotal() {
  const t = S.preview.reduce((s, x) => s + (x.amount || 0), 0);
  $('previewTotal').innerHTML = S.preview.length + ' khoản · <b class="num">' + vnd(t) + '</b>';
  $('btnSave').textContent = 'Lưu ' + S.preview.length + ' khoản';
}
function clearPreview() { S.preview = []; renderPreview(); }

async function savePreview() {
  if (S.preview.some(x => !x.amount)) { toast('Có khoản chưa có số tiền.'); return; }
  const btn = $('btnSave'); busy(btn, true, 'Đang lưu');
  try {
    const n = await api('addTransactions', S.preview);
    toast('Đã lưu ' + n + ' khoản ✓');
    $('quick').value = ''; clearPreview(); loadRecent();
  } catch (e) { fail(e); } finally { busy(btn, false); updPreviewTotal(); }
}

async function loadRecent() {
  try {
    const r = await api('getRecent', 6);
    $('todayTotal').textContent = vnd(r.todayTotal);
    $('recent').innerHTML = r.items.length ? r.items.map(txRow).join('') : '<div class="empty">Chưa có khoản nào. Ghi khoản đầu tiên ở trên nhé.</div>';
    bindTx($('recent'), r.items);
  } catch (e) { fail(e); }
}

function txRow(t) {
  return `<div class="tx" data-id="${esc(t.id)}">
    <div class="ic">${icon(t.category)}</div>
    <div class="grow"><div>${esc(t.description || t.category)}</div>
      <div class="muted">${esc(t.category)} · ${dLabel(t.date)} · ${esc(t.method)}</div></div>
    <div class="amt num">${vnd(t.amount)}</div></div>`;
}
function bindTx(container, list) {
  container.querySelectorAll('.tx').forEach(el => el.onclick = () => openEdit(list.find(t => t.id === el.dataset.id)));
}

/* ---------------- Modal: nhập tay / sửa ---------------- */
function txForm(t) {
  return `
    <label>Mô tả</label><input id="fDesc" value="${esc(t.description || '')}" placeholder="Ví dụ: Cơm trưa">
    <div class="grid2" style="margin-top:8px">
      <div><label>Số tiền (đ)</label><input id="fAmt" class="num" inputmode="numeric" value="${t.amount ? t.amount.toLocaleString('vi-VN') : ''}" onblur="fmtInput(this)"></div>
      <div><label>Ngày</label><input id="fDate" type="date" value="${t.date || S.init.today}"></div>
      <div><label>Danh mục</label><select id="fCat">${catOptions(t.category || 'Ăn uống')}</select></div>
      <div><label>Phương thức</label><select id="fMethod">${methodOptions(t.method || S.init.defaultMethod)}</select></div>
    </div>
    <label>Ghi chú</label><input id="fNote" value="${esc(t.note || '')}">`;
}
function readForm() {
  return { description: $('fDesc').value, amount: digits($('fAmt').value), date: $('fDate').value,
    category: $('fCat').value, method: $('fMethod').value, note: $('fNote').value };
}
function openModal(html) { $('modalBody').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal() { $('modal').classList.add('hidden'); }

function openManual() {
  openModal('<h2>Nhập tay</h2>' + txForm({}) +
    '<div class="row" style="margin-top:14px"><span class="grow"></span><button class="ghost" onclick="closeModal()">Hủy</button><button class="primary" id="btnM" onclick="saveManual()">Lưu</button></div>');
  setTimeout(() => $('fAmt').focus(), 50);
}
async function saveManual() {
  const t = readForm(); if (!t.amount) { toast('Nhập số tiền'); return; }
  const btn = $('btnM'); busy(btn, true);
  try { await api('addTransactions', [t]); closeModal(); toast('Đã lưu ✓'); refreshCurrent(); }
  catch (e) { fail(e); busy(btn, false); }
}

function openEdit(t) {
  if (!t) return;
  S.editing = t;
  openModal('<h2>Sửa khoản chi</h2>' + txForm(t) +
    '<div class="row" style="margin-top:14px"><button class="danger" onclick="delTx()">Xóa</button><span class="grow"></span><button class="ghost" onclick="closeModal()">Hủy</button><button class="primary" id="btnE" onclick="saveEdit()">Lưu</button></div>');
}
async function saveEdit() {
  const t = Object.assign(readForm(), { id: S.editing.id }); if (!t.amount) { toast('Nhập số tiền'); return; }
  const btn = $('btnE'); busy(btn, true);
  try { await api('updateTransaction', t); closeModal(); toast('Đã cập nhật ✓'); refreshCurrent(); }
  catch (e) { fail(e); busy(btn, false); }
}
async function delTx() {
  if (!confirm('Xóa khoản "' + (S.editing.description || S.editing.category) + '" ' + vnd(S.editing.amount) + '?')) return;
  try { await api('deleteTransaction', S.editing.id); closeModal(); toast('Đã xóa'); refreshCurrent(); }
  catch (e) { fail(e); }
}
function refreshCurrent() {
  const b = document.querySelector('nav button.active'); go(b ? b.dataset.tab : 'add');
}

/* ---------------- Tổng quan ---------------- */
function shiftMonth(n) {
  const p = S.dashMonth.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1 + n, 1);
  S.dashMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  loadDash();
}

async function loadDash() {
  $('dashMonth').textContent = ymLabel(S.dashMonth);
  $('dash').innerHTML = '<div class="empty"><span class="spin"></span></div>';
  try { renderDash(await api('getDashboard', S.dashMonth)); } catch (e) { fail(e); }
}

function renderDash(d) {
  const pctBudget = d.budget ? d.total / d.budget * 100 : 0;
  const delta = d.prevTotal ? (d.total - d.prevTotal) / d.prevTotal * 100 : null;
  const remain = d.budget - d.total;
  const kpi = (label, value, sub, cls) => `<div class="kpi"><div class="s">${label}</div><div class="v num ${cls || ''}">${value}</div><div class="s">${sub}</div></div>`;

  let html = '<div class="kpis">' +
    kpi('Tổng chi', vnd(d.total), d.count + ' giao dịch') +
    kpi('Ngân sách còn', vnd(remain), Math.round(pctBudget) + '% đã dùng', remain < 0 ? 'up' : '') +
    kpi('So tháng trước', delta == null ? '—' : (delta >= 0 ? '▲ ' : '▼ ') + Math.abs(Math.round(delta)) + '%',
        'Tháng trước ' + short(d.prevTotal), delta == null ? '' : delta > 0 ? 'up' : 'down') +
    kpi('Chi thường / ngày', vnd(d.avgPerDay), d.daysElapsed && d.daysElapsed < d.daysInMonth ? 'Dự báo ' + short(d.forecast) : d.daysElapsed + ' ngày') +
    '</div>';

  if (d.daysElapsed && d.daysElapsed < d.daysInMonth && d.budget && d.forecast > d.budget) {
    html += `<div class="card" style="border-color:var(--warn)">⚠️ Với tốc độ hiện tại, cuối tháng sẽ chi khoảng <b>${vnd(d.forecast)}</b>, vượt ngân sách <b>${vnd(d.forecast - d.budget)}</b>.</div>`;
  }

  html += '<div class="card"><h2>Theo danh mục</h2>' + (d.byCategory.filter(c => c.amount || c.budget).map(c => {
    const p = c.budget ? c.amount / c.budget * 100 : (c.amount ? 100 : 0);
    const cls = p > 100 ? 'bad' : p >= 80 ? 'warn' : '';
    return `<div class="cat-row"><div class="row">
        <span>${c.icon}</span><span class="grow">${esc(c.name)}</span>
        <span class="num"><b>${vnd(c.amount)}</b> <span class="muted">/ ${c.budget ? short(c.budget) : '—'}</span></span></div>
        <div class="bar"><i class="${cls}" style="width:${Math.min(100, p)}%"></i></div></div>`;
  }).join('') || '<div class="empty">Chưa có dữ liệu</div>') + '</div>';

  html += '<div class="card"><h2>Chi theo ngày</h2>' + dailyChart(d.daily) + '</div>';

  html += '<div class="card"><h2>5 khoản lớn nhất</h2>' + (d.top.length ? d.top.map(txRow).join('') : '<div class="empty">—</div>') + '</div>';

  html += `<div class="card"><div class="row"><h2 class="grow" style="margin:0">🤖 Nhận xét tháng</h2>
    <button id="btnReview" onclick="doReview()">${S.init.hasClaude ? 'Hỏi Claude' : 'Tạo nhận xét'}</button></div>
    <div id="review" class="review" style="margin-top:10px"></div></div>`;

  $('dash').innerHTML = html;
  const topBox = $('dash').querySelectorAll('.card')[$('dash').querySelectorAll('.card').length - 2];
  bindTx(topBox, d.top);
}

function dailyChart(daily) {
  const max = Math.max.apply(null, daily.concat([1]));
  const n = daily.length, w = 100 / n;
  const bars = daily.map((v, i) => {
    const h = v / max * 100;
    return `<rect x="${i * w + w * 0.15}" y="${100 - h}" width="${w * 0.7}" height="${h}" rx="0.6" fill="var(--brand)" opacity="${v ? 1 : 0}"><title>Ngày ${i + 1}: ${vnd(v)}</title></rect>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 100 100" preserveAspectRatio="none">${bars}</svg>
    <div class="row muted" style="font-size:11px"><span class="grow">1</span><span class="grow" style="text-align:center">${Math.ceil(n / 2)}</span><span>${n}</span></div>
    <div class="muted" style="font-size:12px;margin-top:4px">Cao nhất: ${vnd(max === 1 ? 0 : max)}/ngày</div>`;
}

async function doReview() {
  const btn = $('btnReview'); busy(btn, true, 'Đang phân tích');
  try { $('review').innerHTML = md(await api('monthlyReview', S.dashMonth)); }
  catch (e) { fail(e); } finally { busy(btn, false); }
}

/** Markdown tối giản: ##, -, **bold** (đã escape HTML trước). */
function md(text) {
  const out = []; let inList = false;
  esc(text).split('\n').forEach(line => {
    const l = line.trim().replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    if (/^[-*•]\s+/.test(l)) { if (!inList) { out.push('<ul>'); inList = true; } out.push('<li>' + l.replace(/^[-*•]\s+/, '') + '</li>'); return; }
    if (inList) { out.push('</ul>'); inList = false; }
    if (/^#{1,3}\s+/.test(l)) out.push('<h3>' + l.replace(/^#{1,3}\s+/, '') + '</h3>');
    else if (l) out.push('<p>' + l + '</p>');
  });
  if (inList) out.push('</ul>');
  return out.join('');
}

/* ---------------- Lịch sử ---------------- */
let hTimer;
function debounceHistory() { clearTimeout(hTimer); hTimer = setTimeout(loadHistory, 350); }

async function loadHistory() {
  $('hist').innerHTML = '<div class="empty"><span class="spin"></span></div>';
  try {
    const list = await api('getTransactions', $('hMonth').value, $('hCat').value, $('hQ').value);
    const total = list.reduce((s, t) => s + t.amount, 0);
    $('hSummary').innerHTML = list.length + ' khoản · <b class="num">' + vnd(total) + '</b>';
    if (!list.length) { $('hist').innerHTML = '<div class="empty">Không có giao dịch phù hợp</div>'; return; }
    const groups = {}; list.forEach(t => (groups[t.date] = groups[t.date] || []).push(t));
    $('hist').innerHTML = Object.keys(groups).map(d =>
      `<div class="day-h"><span>${dLabel(d)}</span><span class="num">${vnd(groups[d].reduce((s, t) => s + t.amount, 0))}</span></div>` +
      groups[d].map(txRow).join('')).join('');
    bindTx($('hist'), list);
  } catch (e) { fail(e); }
}

/* ---------------- Ngân sách ---------------- */
function renderBudgets() {
  $('budgetList').innerHTML = S.init.categories.map((c, i) => `
    <div class="cat-row row"><span>${c.icon}</span><span class="grow">${esc(c.name)}</span>
      <input class="num" style="max-width:150px;text-align:right" inputmode="numeric" data-i="${i}" value="${c.budget.toLocaleString('vi-VN')}"
        onblur="fmtInput(this)" oninput="updBudgetTotal()"></div>`).join('');
  $('sheetLink').href = S.init.sheetUrl;
  updBudgetTotal();
}
function updBudgetTotal() {
  const t = Array.from($('budgetList').querySelectorAll('input')).reduce((s, el) => s + digits(el.value), 0);
  $('budgetTotal').textContent = vnd(t);
}
async function saveBudgetForm() {
  const list = Array.from($('budgetList').querySelectorAll('input')).map(el => {
    const c = S.init.categories[el.dataset.i]; c.budget = digits(el.value); return { name: c.name, budget: c.budget };
  });
  const btn = $('btnBudget'); busy(btn, true);
  try { await api('saveBudgets', list); toast('Đã lưu ngân sách ✓'); } catch (e) { fail(e); } finally { busy(btn, false); }
}

/* ---------------- Khởi động ---------------- */
(async function start() {
  try {
    S.init = await api('getInitData');
    S.init.categories.forEach(c => S.cats[c.name] = c);
    S.dashMonth = S.init.today.slice(0, 7);
    $('hMonth').value = S.dashMonth;
    $('hCat').innerHTML = '<option value="">Tất cả danh mục</option>' + catOptions('');
    $('engine').textContent = S.init.hasClaude ? '🤖 Claude đang bật' : '⚙️ Chế độ offline';
    renderExamples(); loadRecent();
    $('quick').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) doParse(); });
  } catch (e) {
    document.querySelector('main').innerHTML = '<div class="card"><h2>Chưa khởi tạo</h2><p>' + esc(e.message || e) +
      '</p><p class="muted">Mở Google Sheet → menu <b>💰 Chi tiêu → Khởi tạo</b>, hoặc chạy hàm <code>setup</code> trong Apps Script.</p></div>';
  }
})();
